name: Web Test Bench

# TEMPORARY (#288): measures the web component tests on the CI runner with full
# Chrome or Playwright's headless shell, at one or two workers, both alone and
# under the parallel `build`/`typecheck`/`test` turbo run that `Verify` does.
# Removed before the branch merges.

on:
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    name: Web Test Bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Runner cores
        run: |
          nproc
          node -p "'availableParallelism=' + require('node:os').availableParallelism()"

      - name: Install the headless shell
        run: time pnpm --filter @vmb/web exec playwright install chromium-headless-shell

      - name: Bench
        env:
          CI: "true"
        run: |
          set +e
          pnpm --filter @vmb/web run sync >/dev/null
          TIMEFORMAT='%R %U %S'
          results=()
          # One timed run: label, log file, command. A failed run is recorded
          # and its log tail printed, rather than ending the whole bench.
          bench() {
            local label=$1 log=$2 t rc real user sys dur
            shift 2
            t=$( { time "$@" > "$log" 2>&1; } 2>&1 )
            rc=$?
            read -r real user sys <<<"$t"
            dur=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -E "Test Files|Duration|built in" | tr -s ' ' | tr '\n' ' ')
            results+=("$label rc=$rc real=$real cpu=$(echo "$user + $sys" | bc) $dur")
            if [ "$rc" -ne 0 ]; then
              echo "::group::$label failed (rc=$rc)"
              sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -vE "^\s*✓" | tail -60
              echo "::endgroup::"
            fi
          }
          alone() {
            (cd apps/web && SVELTE_KIT_OUT_DIR=.svelte-kit/test pnpm exec vitest run --project component)
          }
          parallel() {
            pnpm turbo run build test typecheck --filter=@vmb/web --force --env-mode=loose --cache=local:,remote: --output-logs=full
          }
          for round in 1 2; do
            for browser in chrome shell; do
              for workers in 1 2; do
                label="$browser-w$workers-r$round"
                export WEB_TEST_BROWSER=$browser WEB_TEST_MAX_WORKERS=$workers
                bench "alone    $label" "/tmp/alone-$label.log" alone
                bench "parallel $label" "/tmp/turbo-$label.log" parallel
              done
            done
          done
          printf '%s\n' "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
