name: CI

on:
  push:
    branches: [master]
  # No path filter: a PR runs the same gate a push to `master` does, so nothing
  # reaches `master` that a PR could have skipped (ADR-0023). A docs-only PR is
  # affordable because turbo replays its code tasks from the remote cache; only
  # `format:check`, whose inputs are the whole tree, misses.
  pull_request:

# Cancel a PR's superseded runs on new pushes, but never cancel an
# in-flight run on `master` — that's what triggers `deploy`, and cancelling
# a live Cloudflare deploy mid-flight can leave things half-deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All jobs only read the repo. Cloudflare auth is its own token
# (CLOUDFLARE_API_TOKEN), not the GITHUB_TOKEN, so nothing here needs write
# scope — stating it keeps the deploy path off the repository default.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pins turbo's local cache to the path the Actions cache step below
    # persists. `turbo.json` deliberately sets no `cacheDir` — leaving it unset
    # lets a local git worktree share the main worktree's cache — so CI states
    # the path it caches rather than relying on turbo's default. Because
    # `TURBO_CACHE_DIR` takes precedence over `cacheDir`, a future change to
    # `turbo.json` cannot silently move the cache out from under this step.
    env:
      TURBO_CACHE_DIR: .turbo/cache
    # Consumed by `deploy`: whether this push changed anything the deployed
    # artifact depends on (issue #63). Empty on pull requests, where the step
    # below is skipped — `deploy` stays a master-push-only job regardless.
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `Detect code-relevant changes` diffs `github.event.before..HEAD`,
          # so a push to `master` needs the baseline commit in the clone; the
          # default shallow depth (1) does not contain it. A pull request skips
          # that step, so there the full clone is wasted disk and transfer
          # (issue #80). `case()` returns the matching value as-is, so depth
          # `0` survives. The obvious numeric conditional
          # `event == 'push' && 0 || 1` does not: `0` is falsy in GitHub
          # expressions, so it falls through to `1`, the baseline goes missing,
          # and the gate deploys on every push (issue #71).
          fetch-depth: ${{ case(github.event_name == 'push', 0, 1) }}

      # Issue #63: the gate (`Verify`) still runs on every `master` push
      # (#61); only the redundant deploy is skipped. The baseline is the
      # pushed event's `before`, and the path list is the canonical
      # "code-relevant change" definition in preview.yml's `paths`, minus
      # `.github/workflows/**` — a workflow edit self-tests in that PR's
      # Preview run but cannot change the deployed artifact, so it must not
      # force a deploy. `.github/actions/**` stays in the list: the composite
      # action chooses the toolchain and the install flags, so editing it can
      # change what the build produces. The two lists are kept in step by hand
      # (issue #70); see ADR-0019.
      #
      # Living inside `Verify` rather than a job of its own is deliberate: a
      # separate job would add one more skipped check to every pull request.
      #
      # Fail open: an unusable baseline (force-push, first push, bad SHA) or a
      # `git diff` error deploys rather than skips, and warns so the failure is
      # visible instead of silent. A skipped deploy is invisible until someone
      # notices production is stale; a spurious one is only wasteful, but a
      # silent fail-open hides a broken gate — see the checkout comment above.
      - name: Detect code-relevant changes
        id: changes
        if: github.event_name == 'push'
        env:
          # Passed through the environment, never interpolated into the script.
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail

          # An unusable baseline must deploy, not skip: GitHub sends the
          # all-zero SHA on a first push or a new branch, and a force-push can
          # name a commit that is no longer reachable. The all-zero SHA matches
          # the hex shape, so it is rejected explicitly.
          if ! printf '%s' "$BEFORE" | grep -qE '^[0-9a-f]{40}$' \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable baseline ('$BEFORE'); assuming code changed."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --quiet "$BEFORE" HEAD -- \
            apps \
            packages \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            package.json \
            fnox.toml \
            .mise.toml \
            .github/actions
          status=$?

          # `--quiet` exits 1 when there are differences and 0 when there are
          # none; anything else (a missing object, a bad baseline) is a real
          # error and must not be read as "no changes".
          case "$status" in
            0)
              echo "No code-relevant changes in $BEFORE..HEAD; the deploy will be skipped."
              code_changed=false
              ;;
            1)
              echo "Code-relevant changes detected in $BEFORE..HEAD."
              code_changed=true
              ;;
            *)
              echo "::warning::git diff $BEFORE..HEAD failed (exit $status); deploying to be safe."
              code_changed=true
              ;;
          esac
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      # Toolchain, pnpm store cache, and a frozen-lockfile install: one
      # composite action so the cache key and install flags live in a single
      # place (issue #79).
      - uses: ./.github/actions/setup

      # Restore turbo's local cache on the credential-free path (Dependabot
      # runs, and any run before TURBO_TOKEN/TURBO_TEAM are provisioned). With
      # no remote cache, turbo falls back to `.turbo/cache` — a directory the
      # ephemeral runner builds from scratch and discards, so those runs
      # rebuild every task. Persisting it with the Actions cache gives the
      # secret-free path the same task replay the remote cache gives every
      # other run (issue #81).
      #
      # Scoped so it cannot be mistaken for the remote cache. The entry's key
      # is namespaced `turbo-local-`, and it is only saved on a run with no
      # remote credentials. Persisting this path unconditionally was rejected:
      # a token-bearing run also mirrors its task outputs into `.turbo/cache`,
      # so restoring here when the token is present would let a local copy of a
      # remote entry answer as a local hit, erasing the distinction the two
      # caches exist to keep. The remote path is otherwise untouched.
      - name: Detect turbo remote-cache credentials
        id: turbo-remote-cache
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ -n "$TURBO_TOKEN" ] && [ -n "$TURBO_TEAM" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v6
        if: steps.turbo-remote-cache.outputs.configured == 'false'
        with:
          # The directory `TURBO_CACHE_DIR` pins for this job (see the job-level
          # env), so the Actions cache and turbo's local cache always agree on
          # the path.
          path: .turbo/cache
          # `github.sha` makes a re-run of the same commit an exact hit;
          # `restore-keys` lets a later commit in the same ref scope restore
          # the most recent entry and replay whatever its unchanged tasks hashed
          # to.
          key: turbo-local-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-local-${{ runner.os }}-

      # The format gate is its own step so a formatting failure reads as a
      # formatting failure rather than a cancelled typecheck (issue #59). It
      # needs no fnox secrets, so it needs no `fnox exec` wrapper and no
      # Dependabot split, and it runs before the Playwright install below to
      # fail fast. Always repo-wide, never scoped to the diff (ADR-0023).
      - name: Format
        run: pnpm turbo format:check
        env:
          # Empty on a Dependabot run, where turbo falls back to the local cache.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # apps/web's component tests render .svelte files in a real browser
      # (vitest-browser-svelte + @vitest/browser-playwright). Cache the
      # downloaded browser binaries; OS deps still need installing every
      # run since GitHub-hosted runners are ephemeral.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vmb/web exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @vmb/web exec playwright install-deps chromium

      # Dependabot-triggered runs receive no Actions secrets — GitHub keeps a
      # separate Dependabot secrets store, and this repo's is empty — so the
      # fnox-wrapped step below cannot run for them: FNOX_AGE_KEY is missing,
      # and FNOX_IF_MISSING: error turns that into a hard failure. Those runs
      # would otherwise be born red for a reason unrelated to the bump, which
      # teaches everyone to ignore the check (issue #45).
      #
      # This secret-free step keeps the signal meaningful instead. The suite
      # needs no secrets — every test mocks its database, and build/lint/
      # typecheck/format read none — so a bump that breaks one of them still
      # turns the check red, and a clean bump turns it green. Withholding
      # FNOX_AGE_KEY (which unlocks every dev secret in the committed store)
      # from a run that installs freshly-bumped third-party code is deliberate;
      # see ADR-0020.
      #
      # "Dependabot" is detected by the triggering actor *or* the pull request
      # author. The author term matters: a maintainer re-running this job, or
      # pushing to the branch, sets the actor to the human, and without it that
      # would flip the run — and its secrets — onto freshly-bumped code. On
      # `master` pushes there is no pull request, so the author term is empty
      # and the full path below runs.
      - name: Verify (Dependabot)
        if: github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]'
        run: pnpm turbo build test lint typecheck

      # DATABASE_URL and other dev secrets are age-encrypted and committed
      # via fnox (ADR-0011); FNOX_AGE_KEY unlocks them in CI.
      # TURBO_TOKEN/TURBO_TEAM enable the Vercel remote cache. When the
      # secrets aren't provisioned they resolve to empty strings, and turbo
      # falls back to the local cache rather than failing.
      - name: Verify
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: fnox exec -- pnpm turbo build test lint typecheck
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          # Without this, fnox warns and exits 0 while exporting empty values
          # when the key can't decrypt — so a broken FNOX_AGE_KEY fails open.
          FNOX_IF_MISSING: error
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # Kept as its own job so a broken workflow file reads as a workflow failure,
  # not a test failure. This is also the only place the workflow YAML itself is
  # validated before it runs: actionlint catches bad expressions and dangling
  # `needs:` references that GitHub happily accepts until the run fails, and
  # shellcheck (found on PATH below) lints every `run:` block — plus the
  # `scripts/**/*.sh` wizards, which nothing else checked (issue #61).
  # actionlint also checks the local composite action the workflows reference,
  # so `.github/actions/setup/action.yml` is validated here too (issue #79).
  lint-workflows-and-scripts:
    name: Lint Workflows and Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Both tools come from .mise.toml (ADR-0010), so their versions are
      # pinned with the rest of the toolchain instead of a floating download.
      # The composite action is the same one every other job bootstraps with;
      # `install-args` narrows it to these two and `install-dependencies` opts
      # out of the pnpm store and install this job has no use for, keeping it
      # fast (issue #79).
      - uses: ./.github/actions/setup
        with:
          install-args: actionlint shellcheck
          install-dependencies: "false"

      # No arguments: actionlint walks .github/workflows on its own.
      - run: actionlint

      # actionlint shellchecks only the shell inside workflow `run:` blocks.
      # `find` (not a `**` glob) so this works whatever the shell's `globstar`
      # setting is, and `-r` so an empty result is not an error.
      - name: Shellcheck scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

  deploy:
    name: Release
    needs: build-and-test
    # Skip the redundant deploy when the push changed nothing the artifact
    # depends on. `Verify` above still ran; only the deploy is gated, so the
    # PR gate still mirrors the master gate (ADR-0023). Issue #63.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.build-and-test.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Reads from the remote cache that build-and-test just populated:
      # PUBLIC_API_URL is unset here, so this is the production hash — the
      # per-PR preview build (which sets it) can't collide with this entry.
      - run: fnox exec -- pnpm turbo build
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          FNOX_IF_MISSING: error
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Deploy API (Cloudflare Workers)
        # `run deploy`: bare `pnpm deploy` is pnpm's own deploy command, not
        # this package's `deploy` script (ERR_PNPM_INVALID_DEPLOY_TARGET).
        run: pnpm --filter @vmb/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web (Cloudflare Pages)
        run: pnpm --filter @vmb/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
