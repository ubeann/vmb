name: Preview

# Per-PR preview environment (issue #23): a live `apps/api` Worker Preview, a
# live `apps/web` Pages deployment, and an isolated Neon branch — so migrations
# and the full stack get a real dry run before merging, without touching
# production or a shared staging database.
#
# The alias (`pr<N>-<slug>`, or the `pr-<N>` fallback) and the prefix (`pr<N>-`)
# come from `scripts/preview-identifiers.sh`, the one definition this workflow
# shares with cleanup.yml (issue #78), and the alias names all three resources,
# so the whole environment reads the same (ADR-0029):
#   - API:   https://pr<N>-<slug>-vmb-api.<account>.workers.dev  (Worker Preview)
#   - Web:   https://pr<N>-<slug>.vmb-web.pages.dev              (Pages branch alias, as far as Cloudflare keeps it)
#   - DB:    Neon branch `pr<N>-<slug>`, carrying the `app` database (see the Resolve step)
#
# A fourth identifier, the GitHub deployment environment `preview/pr-<N>` (see
# the Register step), is number-keyed rather than slugged, because the
# environments endpoint deletes by exact name and a retitle must not strand it
# (issue #154).
#
# Three preview resources aren't self-cleaning: the Neon branch, the Pages
# deployment(s), and the GitHub deployment environment. The Pages side is pruned
# here after each successful deploy so an open PR keeps only its newest
# deployment (issue #84); cleanup.yml is the close-time safety net that deletes
# the Neon branch, any Pages deployment this prune left behind, and the
# environment (issues #55, #154). The Worker Preview is deleted there too;
# Cloudflare also drops the least recently deployed Preview past 100 per
# Worker on the free plan, so a missed delete only waits to be pruned. A
# Preview deployment is not a `vmb-api` version, so previews no longer add to
# the version count issue #152 measured. See cleanup.yml for the full
# distinction.
#
# Whether a PR gets a preview at all is decided by the `Detect code-relevant
# changes` step, the first of the `preview` job's steps, not a trigger-level
# `paths` filter. The canonical "code-relevant change" definition lives in
# `scripts/code-relevant-paths.sh` (issue #83), and a workflow's `on.paths`
# cannot reference a shared value — as a hand-kept copy it could only drift from
# `ci.yml`'s deploy gate (issue #70, ADR-0019). Every step after it runs only
# when the step did not report `code_changed=false`, so a docs-only PR ends as a
# short `Create Environment` run with its steps skipped and no Cloudflare or Neon
# resource created. It used to be a separate secret-free job; a job bills a
# whole minute however short it runs, and a step that references no secrets
# gives the same isolation for free (issue #382, ADR-0019's amendment).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # No `paths` filter — see the header: the definition is shared from
    # `scripts/code-relevant-paths.sh` and consumed by the `preview` job's first
    # step. A docs-only PR still runs this workflow, but that step reports no
    # change, so every step after it, the ones that hold secrets and create
    # Cloudflare/Neon resources, is skipped.

# Shared with cleanup.yml's `pull_request: closed` run, so closing a PR
# normally cancels any in-flight preview deploy in this group before the
# cleanup deletes the Neon branch — a half-finished run creating the branch
# after deletion would leak it. GitHub documents same-group ordering as not
# guaranteed, so read that as the normal path rather than a promise: the
# branch's `expires_at`, renewed on every preview run through the API's PATCH
# (issue #150), is the backstop when a cancelled run does create one after
# cleanup. Otherwise, a new push cancels this PR's superseded preview run; the
# branch is reused, not recreated.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to register the web preview as a GitHub deployment (issue #154).
  deployments: write
  # Needed to post/update the sticky preview-URLs comment.
  pull-requests: write

jobs:
  preview:
    name: Create Environment
    runs-on: ubuntu-latest
    # Dependabot-triggered runs receive no Actions secrets, and this job cannot
    # work without them: `Resolve preview URLs` 404s on an empty
    # CLOUDFLARE_API_TOKEN, and the Neon and fnox steps need their secrets too.
    # Rather than fail for a reason unrelated to the bump, skip it entirely
    # (issue #45).
    #
    # Skipping is also the safer choice: a run whose purpose is to install and
    # build freshly-bumped third-party code should not hold
    # CLOUDFLARE_API_TOKEN (which deploys production) or FNOX_AGE_KEY (which
    # unlocks every dev secret in the committed store). The job cannot be made
    # secret-free — it needs Neon and Cloudflare — so there is no narrower
    # option. See ADR-0020.
    #
    # "Dependabot" is detected by the triggering actor *or* the pull request
    # author, so a maintainer re-run or a push to the branch cannot flip a
    # Dependabot PR onto the secret path.
    #
    # GitHub counts a conditionally-skipped job as satisfying a required check
    # (it concludes `skipped`, which branch protection treats as success), so
    # this does not wall Dependabot PRs off from merging. Because no Neon
    # branch is created here, cleanup.yml has nothing to delete for them either
    # and skips them the same way.
    #
    # A docs-only PR does not skip the job, only its steps: the detection step
    # below is the one step that runs, it references no secrets, and every later
    # step carries `if: steps.changes.outputs.code_changed != 'false'` (issues
    # #83, #382). The guards in this `if:` stay at the job level for that reason:
    # a Dependabot or fork run must not start a job that holds the secrets, even
    # one whose steps would all skip.
    #
    # Fork PRs skip it too (issue #149, ADR-0030). GitHub passes no repository
    # secrets to a `pull_request`-triggered run from a fork (GITHUB_TOKEN
    # excepted), so such a PR would start this job and fail at `Resolve preview
    # identifiers` on an empty CLOUDFLARE_API_TOKEN — red for a reason unrelated
    # to the change. `pull_request` stays the trigger: `pull_request_target`
    # would run a fork's code with the base repository's secrets, which is
    # exactly what this guard exists to avoid. The skip is safe because a fork
    # PR never creates a Cloudflare or Neon resource, so there is nothing for
    # cleanup.yml to reap either — it skips them the same way.
    #
    if: "github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository"
    timeout-minutes: 10
    # The two names this preview's contract with production is built from,
    # defined once for the whole job: the database every environment branch
    # carries (ADR-0029) and the branch previews fork from — pinned rather than
    # left to the project default (issue #118). The create step below and the
    # schema-diff step both read them, so changing either name moves creation
    # and comparison together. (A preview branch reused across pushes keeps the
    # parent it was created with; the diff's base is this named branch, not a
    # per-branch `parent_id` lookup.)
    env:
      NEON_DB_NAME: app
      NEON_PARENT_BRANCH: production
    steps:
      - uses: actions/checkout@v7

      # Decides whether this PR is code-relevant before anything that holds a
      # secret runs. Secret-free by design: it only diffs the checkout, so it
      # references no `secrets.*`, and the job-level `env` above carries none
      # either. The canonical definition is `scripts/code-relevant-paths.sh`;
      # the `preview` mode adds `.github/workflows/**`, because a workflow edit
      # cannot change the deployed artifact but still has to be exercised by the
      # PR's own preview before it lands (ADR-0023, issue #83).
      #
      # Fail open, like the deploy gate. The module publishes `true` for
      # anything but a definitive "no change". `continue-on-error` covers the
      # step itself failing: it would publish no output, and an absent output is
      # not `false`, so every later step still runs rather than silently
      # skipping a code PR.
      - name: Detect code-relevant changes
        id: changes
        continue-on-error: true
        env:
          # The default checkout is the test merge commit, whose first parent is
          # the PR's base commit — the baseline the diff is measured against.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # shellcheck source=scripts/code-relevant-paths.sh
          . scripts/code-relevant-paths.sh

          # A depth-1 clone carries the merge commit but not its parent. Fetch
          # the base commit so the diff can name it; if the fetch fails the
          # module returns "undetermined" (2) and the preview runs (fail open),
          # so the warning below is not a silent skip.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" \
              || echo "::warning::Could not fetch the base commit $BASE_SHA; running the preview to be safe."
          fi

          emit_code_relevant_change "$BASE_SHA" HEAD preview

      # Toolchain, pnpm store cache, and a frozen-lockfile install: the same
      # composite action `ci.yml` bootstraps with (issue #79).
      - uses: ./.github/actions/setup
        if: steps.changes.outputs.code_changed != 'false'

      # The alias and the prefix both come from
      # `scripts/preview-identifiers.sh` (issue #78), so create and destroy read
      # one definition; the alias is also the Neon branch name (ADR-0029). The
      # alias is slugged from the pull request title
      # with its Conventional Commit prefix stripped, falls back to the branch
      # name and then `pr-<N>`, and is capped so the whole alias fits inside
      # Cloudflare Pages' 28-character branch-alias limit — a longer one is
      # truncated by Pages, so a URL computed from it would not resolve.
      # Cloudflare may still disambiguate a colliding alias with a suffix, so
      # the web link posted below is the URL wrangler reports, not `web_url`
      # here. `scripts/preview-identifiers.test.sh` pins the cases (#155).
      #
      # The account's workers.dev subdomain is not known to the workflow —
      # read it from the Cloudflare API rather than a hardcoded repo variable.
      # (`<PREVIEW_NAME>-<WORKER_NAME>.<SUBDOMAIN>.workers.dev`, per
      # Cloudflare's Previews docs; the deploy step checks wrangler reports
      # the same URL.)
      - name: Resolve preview identifiers
        if: steps.changes.outputs.code_changed != 'false'
        id: ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed through the environment, never interpolated into the script:
          # a branch name is attacker-controlled text.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Same reason as HEAD_REF, and the alias's first source: a pull
          # request title is attacker-controlled text too.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh

          subdomain=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // ""')

          if [ -z "$subdomain" ]; then
            echo "::error::Could not resolve the account's workers.dev subdomain — check CLOUDFLARE_API_TOKEN's Workers scope."
            exit 1
          fi

          alias=$(preview_alias "$PR_NUMBER" "$PR_TITLE" "$HEAD_REF")
          # The Neon branch carries the alias, so the console, the comment and
          # the preview URLs all show one name (ADR-0029).
          neon_branch=$alias

          # Safety net for a run that dies before cleanup.yml sees the PR close
          # (issue #118): the branch expires 30 days from now, longer than any
          # plausible PR lifetime. One definition, read by two steps: the create
          # step, whose action honours it only when it creates the branch, and
          # the renewal step below, which PATCHes it onto a branch that already
          # exists — the API accepts `expires_at` on an existing branch, the
          # action does not — so a PR open longer than 30 days keeps its safety
          # net (issue #150).
          neon_expires_at=$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "alias=$alias"
            echo "neon_branch=$neon_branch"
            echo "neon_expires_at=$neon_expires_at"
            echo "api_url=https://${alias}-vmb-api.${subdomain}.workers.dev"
            echo "web_url=https://${alias}.vmb-web.pages.dev"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved preview alias: $alias"
          echo "Resolved Neon branch: $neon_branch"

      # The Neon branch carries the alias (ADR-0029), and the alias moves when a
      # title is edited. The create-branch action is idempotent only for the name
      # it is handed, so without the rename step below a retitle would create a
      # second branch for the same PR. Renaming is enough: a Neon branch name is
      # a label, and the branch id, its endpoint host and its `app` database are
      # unchanged, so a live preview's connection string keeps working.
      - name: Align this PR's Neon branch name
        if: steps.changes.outputs.code_changed != 'false'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEON_BRANCH: ${{ steps.ids.outputs.neon_branch }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # shellcheck source=scripts/neon-preview-branches.sh
          . scripts/neon-preview-branches.sh

          matches=$(neon_matching_branches "$NEON_PROJECT_ID" "$NEON_API_KEY" "$PR_NUMBER")

          # One branch should match: this PR's own. If the desired name is
          # already among them there is nothing to do; otherwise the first match
          # is renamed and any extras — a leftover from a failed rename, a
          # cancelled race, say — are left for Cleanup, which deletes every
          # match.
          rename_id=""
          rename_from=""
          extras=0
          while IFS=$'\t' read -r branch_id name; do
            [ -n "$branch_id" ] || continue

            if [ "$name" = "$NEON_BRANCH" ]; then
              echo "Neon branch '$name' already carries this PR's name."
              exit 0
            fi

            if [ -z "$rename_id" ]; then
              rename_id=$branch_id
              rename_from=$name
            else
              extras=$((extras + 1))
            fi
          done <<< "$matches"

          if [ -z "$rename_id" ]; then
            echo "No Neon branch for this PR yet; the create step will make '$NEON_BRANCH'."
            exit 0
          fi

          if [ "$extras" -gt 0 ]; then
            echo "::warning::$extras other branch(es) also match this PR; renaming '$rename_from' and leaving the rest to Cleanup."
          fi

          echo "Renaming Neon branch '$rename_from' ($rename_id) to '$NEON_BRANCH'."
          neon_rename_branch "$NEON_PROJECT_ID" "$NEON_API_KEY" "$rename_id" "$NEON_BRANCH"

      # Idempotent: if a branch with this PR's alias already exists (a re-push to
      # the same PR), the action returns the existing branch instead of failing.
      # The name comes from the shared module (via the Resolve step), not a
      # second inline definition (issue #78).
      #
      # `database` and `parent_branch` are pinned rather than left to the
      # action's defaults (`neondb` and the project's default branch), so the
      # preview's contract with production is explicit (issue #118):
      #
      #   - `NEON_DB_NAME` (`app`) is the database production runs on, under
      #     the one name every environment branch carries (ADR-0029). `db_url`
      #     feeds both the migration step and the preview Worker's
      #     DATABASE_URL, so the default pointed both at `neondb`, a database
      #     production never migrated and which no longer exists.
      #   - `NEON_PARENT_BRANCH` (`production`) makes the fork point a decision.
      #     The project default is production today, but left implicit a
      #     project-default change would silently repoint every preview.
      #
      # `branch_type` stays `default` (copy-on-write, rows included): the
      # parent's `drizzle.__drizzle_migrations` journal travels with the
      # schema, so `db:migrate` applies only what's new. `schema-only` would
      # arrive with an empty journal and replay from `0000`.
      #
      # `expires_at` (30 days, computed in the Resolve step) is the cleanup
      # safety net a leaked branch needs if a run dies before cleanup.yml sees
      # the PR close: it deletes itself rather than surviving unreaped. The
      # action applies it only on the path that creates the branch; the renewal
      # step below re-applies it on every run (issue #150).
      # `ssl: verify-full` rather than the action's `require` default: `pg`
      # treats `require` as `verify-full` today and warns that a future major
      # version will not, so naming the stronger mode keeps the behaviour and
      # keeps the warning out of the migrate and seed logs.
      - name: Create Neon branch
        if: steps.changes.outputs.code_changed != 'false'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ steps.ids.outputs.neon_branch }}
          database: ${{ env.NEON_DB_NAME }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          ssl: verify-full
          expires_at: ${{ steps.ids.outputs.neon_expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # The action's idempotent path returns an existing branch and applies
      # nothing, so without this a PR open longer than 30 days would lose its
      # cleanup safety net while its branch is still live (issue #150). The API
      # accepts `expires_at` on an existing branch — at most 30 days from now,
      # the value the Resolve step computed for this run — so every preview run
      # renews the deadline rather than leaving it at the creation date.
      #
      # The target is this PR's own branch, the id the create step just
      # returned. The step checks the branch's actual name before it PATCHes:
      # the name must be this PR's `pr<N>-` branch, and the id must resolve to
      # that same name, so a protected, default or parent branch — `production`
      # is both the parent and the project default — can never be a target.
      # Neon would refuse to expire such a branch anyway, but the run should
      # not rely on the API rejecting a request the workflow should never make.
      #
      # A failed renewal fails the run: leak prevention that silently stops
      # working is the failure this step exists to remove, and the failure
      # names the branch id.
      - name: Renew this PR's Neon branch expiry
        if: steps.changes.outputs.code_changed != 'false'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEON_BRANCH: ${{ steps.ids.outputs.neon_branch }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_EXPIRES_AT: ${{ steps.ids.outputs.neon_expires_at }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # shellcheck source=scripts/neon-preview-branches.sh
          . scripts/neon-preview-branches.sh

          if ! preview_name_matches "$PR_NUMBER" "$NEON_BRANCH"; then
            echo "::error::Refusing to set an expiry on '$NEON_BRANCH', which is not PR #$PR_NUMBER's branch."
            exit 1
          fi

          # The desired name above is the workflow's own derivation; this reads
          # the branch the create step actually returned, so a branch id that
          # points somewhere else stops here instead of being PATCHed.
          if ! target_branch=$(neon_branch_name "$NEON_PROJECT_ID" "$NEON_API_KEY" "$NEON_BRANCH_ID"); then
            echo "::error::Could not read the name of Neon branch $NEON_BRANCH_ID; refusing to set an expiry on a branch that cannot be identified."
            exit 1
          fi

          if [ "$target_branch" != "$NEON_BRANCH" ]; then
            echo "::error::Neon branch $NEON_BRANCH_ID is '$target_branch', not '$NEON_BRANCH' — refusing to set an expiry on it."
            exit 1
          fi

          if ! neon_set_branch_expiry \
            "$NEON_PROJECT_ID" "$NEON_API_KEY" "$NEON_BRANCH_ID" "$NEON_EXPIRES_AT"; then
            echo "::error::Could not renew the expiry of Neon branch $NEON_BRANCH_ID ('$NEON_BRANCH'); the branch would outlive its cleanup safety net."
            exit 1
          fi

      - name: Run database migrations against the PR's Neon branch
        if: steps.changes.outputs.code_changed != 'false'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @vmb/db db:migrate

      # Reviewers learn what this PR's migrations did to the schema, not just
      # that they ran (issue #153). Neon's `compare_schema` endpoint diffs the
      # preview branch — the target, which just received the migrations — against
      # `NEON_PARENT_BRANCH` (production, the branch previews fork from),
      # resolved here because the endpoint takes ids while the job configures
      # names.
      #
      # Best-effort, like the Pages prune below: a diff that cannot be computed
      # must not fail a preview that otherwise deployed. Every handled failure
      # path exits 0 with `status=unavailable`, which the comment step renders
      # as "the diff was unavailable" — the same shape as "the deploy did not
      # finish" — rather than as a red run or an empty section, and
      # `continue-on-error` keeps that promise even for an unhandled bug.
      #
      # The API caps a diff at 20,000 lines; the excerpt written for the
      # comment step keeps the first 200 lines, and the comment step bounds it
      # again by characters, so a huge migration cannot approach the comment
      # API's 65,536-character limit. This step prints the full diff to its log
      # as it computes the excerpt, so the comment's truncation note can point
      # there.
      - name: Compare schema with production
        if: steps.changes.outputs.code_changed != 'false'
        id: schema_diff
        # Belt and braces with the script's own `set +e`: a step that dies
        # before it can write its outputs must still leave the preview to
        # deploy (the comment then defaults to "unavailable").
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PREVIEW_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          # Best-effort by design: clear the runner's inherited `-e` so an
          # unexpected failure here cannot fail an otherwise-green deploy.
          set +e
          set -uo pipefail

          status="unavailable"
          lines=0
          truncated="false"
          # More than a typical migration, and cheap to raise — the comment
          # section stays scannable because it lives in `<details>`.
          max_lines=200
          excerpt_file="$RUNNER_TEMP/schema-diff.diff"
          full_file="$RUNNER_TEMP/schema-diff.full.diff"
          : > "$excerpt_file"

          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"

          # `search` narrows the server-side page to branches whose names
          # contain the parent's, so the exact-name match fits one page in
          # practice. A miss — or a listing failure — leaves the id empty and
          # the diff reports `unavailable`, never a comparison against the
          # wrong branch.
          base_branch_id=""
          if branches=$(curl -fsS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "$api/branches?limit=100&search=$NEON_PARENT_BRANCH"); then
            base_branch_id=$(printf '%s' "$branches" \
              | jq -r --arg name "$NEON_PARENT_BRANCH" '[.branches[] | select(.name == $name) | .id] | first // ""')
          else
            echo "::warning::Could not list Neon branches to resolve '$NEON_PARENT_BRANCH'."
          fi

          if [ -z "$base_branch_id" ]; then
            echo "::warning::Could not resolve a Neon branch named '$NEON_PARENT_BRANCH'; the schema diff will be reported as unavailable."
          else
            # -G + --data-urlencode build the query string; the ids and database
            # name are not pasted into it by hand.
            if ! response=$(curl -fsS -G \
              -H "Authorization: Bearer $NEON_API_KEY" \
              --data-urlencode "base_branch_id=$base_branch_id" \
              --data-urlencode "db_name=$NEON_DB_NAME" \
              "$api/branches/$PREVIEW_BRANCH_ID/compare_schema"); then
              echo "::warning::compare_schema failed for branch $PREVIEW_BRANCH_ID; the schema diff will be reported as unavailable."
            elif ! diff=$(printf '%s' "$response" | jq -er '.diff | strings'); then
              # `strings` yields nothing (and jq exits non-zero) unless `.diff`
              # is a string, so a malformed response, a missing field or a
              # non-string one all fail here: the schema is unknown rather than
              # known-unchanged, and a changed status would be a lie.
              echo "::warning::Could not read a diff from the compare_schema response; the schema diff will be reported as unavailable."
            elif [ -z "${diff//[[:space:]]/}" ]; then
              # No differences at all: the API returns an empty `diff`, and the
              # comment says so explicitly rather than posting an empty block.
              status="unchanged"
            else
              status="changed"
              printf '%s\n' "$diff" > "$full_file"
              lines=$(wc -l < "$full_file" | tr -d ' ')
              head -n "$max_lines" "$full_file" > "$excerpt_file"
              if [ "$lines" -gt "$max_lines" ]; then
                truncated="true"
              fi
            fi
          fi

          # The comment carries a bounded excerpt; the full diff goes to this
          # step's log, which is what the comment's truncation note links to.
          if [ "$status" = "changed" ]; then
            echo "--- full schema diff against '$NEON_PARENT_BRANCH' ---"
            cat "$full_file"
            echo "--- end schema diff ---"
          fi

          {
            echo "status=$status"
            echo "lines=$lines"
            echo "truncated=$truncated"
            echo "excerpt_file=$excerpt_file"
          } >> "$GITHUB_OUTPUT"

          echo "Schema diff against '$NEON_PARENT_BRANCH': status=$status lines=$lines truncated=$truncated"

      # The branch inherits production's rows — `branch_type` stays `default`
      # so the migration journal travels with the schema (see the Create Neon
      # branch step) — and this is where those rows stop being production's
      # (issue #120). Every run replaces every row in the five application
      # schemas with deterministic fixtures, so a preview URL never serves a
      # production record and every push starts from the same dataset. Running
      # on every push rather than only at branch creation is deliberate: the
      # branch is reused across pushes, and a deterministic dataset every time
      # is the seeder's whole point. The wipe and the inserts are one
      # transaction, so a failed seed rolls back and fails this job before the
      # Preview is deployed — never a live, half-emptied preview.
      - name: Seed the PR's Neon branch with deterministic fixtures
        if: steps.changes.outputs.code_changed != 'false'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @vmb/db db:seed

      # Shared secrets (BETTER_AUTH_SECRET, RESEND_API_KEY, EMAIL_FROM,
      # CLIENT_IP_SECRET) come from the committed fnox store, same as
      # build-and-test in ci.yml. ADR-0011 keeps fnox to local/CI secrets and out
      # of Worker runtime, so this is the narrow exception ADR-0019 records: fnox
      # feeds only this PR's Worker Preview, never the production deployment.
      #
      # The three per-PR values — DATABASE_URL, BETTER_AUTH_URL, WEB_URL — are
      # overridden so the preview Worker talks only to this PR's database and
      # accepts the preview web origin (Better Auth `baseURL`/`trustedOrigins`
      # and the auth route's CORS allowlist all read these).
      #
      # EMAIL_TRANSPORT=log is what keeps a preview from sending real mail
      # (issue #121): the Resend key and EMAIL_FROM above still ride along, but
      # the API logs the message instead of handing it to Resend, so a stranger
      # who finds the unlisted-but-public preview URL cannot send from the
      # production sender. The logged message, OTP code included, is read in
      # the Preview's Observability tab. Production leaves the flag unset and
      # sends for real.
      #
      # CLIENT_IP_SECRET lets the API trust the browser address the web preview
      # forwards (#250, ADR-0042). The web side reads it from the vmb-web Pages
      # Preview environment, which every preview shares, so that value is set
      # once by hand to fnox's and must change with it.
      #
      # Written as JSON so Neon's connection string and any special characters
      # survive intact; `--secrets-file` keeps them out of argv/logs.
      - name: Assemble API preview secrets
        if: steps.changes.outputs.code_changed != 'false'
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          # fnox exits 0 with empty values when FNOX_AGE_KEY can't decrypt;
          # error keeps a broken/missing key from silently shipping empties.
          FNOX_IF_MISSING: error
          NEON_DB_URL: ${{ steps.neon.outputs.db_url }}
          API_PREVIEW_URL: ${{ steps.ids.outputs.api_url }}
          WEB_PREVIEW_URL: ${{ steps.ids.outputs.web_url }}
        run: |
          set -euo pipefail

          # `fnox get`, not `fnox export -f env` — the export writes
          # `export KEY=value` lines (plus comment headers), so grepping
          # `^KEY=` finds nothing. get returns the raw value, and with
          # FNOX_IF_MISSING: error an unresolvable key fails here, not as "".
          better_auth_secret=$(fnox get BETTER_AUTH_SECRET)
          resend_api_key=$(fnox get RESEND_API_KEY)
          email_from=$(fnox get EMAIL_FROM)
          client_ip_secret=$(fnox get CLIENT_IP_SECRET)

          jq -n \
            --arg DATABASE_URL "$NEON_DB_URL" \
            --arg BETTER_AUTH_SECRET "$better_auth_secret" \
            --arg BETTER_AUTH_URL "$API_PREVIEW_URL" \
            --arg WEB_URL "$WEB_PREVIEW_URL" \
            --arg RESEND_API_KEY "$resend_api_key" \
            --arg EMAIL_FROM "$email_from" \
            --arg EMAIL_TRANSPORT "log" \
            --arg CLIENT_IP_SECRET "$client_ip_secret" \
            '{
              DATABASE_URL: $DATABASE_URL,
              BETTER_AUTH_SECRET: $BETTER_AUTH_SECRET,
              BETTER_AUTH_URL: $BETTER_AUTH_URL,
              WEB_URL: $WEB_URL,
              RESEND_API_KEY: $RESEND_API_KEY,
              EMAIL_FROM: $EMAIL_FROM,
              EMAIL_TRANSPORT: $EMAIL_TRANSPORT,
              CLIENT_IP_SECRET: $CLIENT_IP_SECRET
            }' > "$RUNNER_TEMP/api-preview-secrets.json"

          for key in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL WEB_URL RESEND_API_KEY EMAIL_FROM EMAIL_TRANSPORT CLIENT_IP_SECRET; do
            value=$(jq -r --arg key "$key" '.[$key]' "$RUNNER_TEMP/api-preview-secrets.json")
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::$key resolved to an empty value — check the fnox store / create-branch output."
              exit 1
            fi
          done

      # `wrangler preview` creates this PR's Worker Preview on the first run and
      # deploys to it on later ones (ADR-0019's 2026-10-07 amendment). A Preview
      # deployment is not a `vmb-api` version, so its secrets (the file above)
      # stay with the Preview. While previews were versions uploaded with
      # `--preview-alias`, each production `wrangler deploy` took the newest
      # version's secrets, a preview's. The Preview also gets wrangler.toml's
      # `[previews.observability]`, so its logs, unlike a version URL's, are kept.
      #
      # `--ignore-base-config` keeps wrangler.toml the only source of the
      # Preview's settings, so a Previews Base change made in the dashboard does
      # not reach CI. `--env=""` states the top-level Worker explicitly; without
      # it wrangler warns, because wrangler.toml defines [env.staging].
      #
      # BETTER_AUTH_URL in the secrets file and the web build both use the
      # computed API URL, so the step fails if Cloudflare reports another one.
      # A Preview takes over an older version alias of the same name, so an
      # open PR's URL survives the switch.
      - name: Deploy API preview
        if: steps.changes.outputs.code_changed != 'false'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ALIAS: ${{ steps.ids.outputs.alias }}
          API_PREVIEW_URL: ${{ steps.ids.outputs.api_url }}
          # The PR's head commit, not `GITHUB_SHA`. On `pull_request` the latter
          # is the synthetic merge commit (`refs/pull/<n>/merge`), so the
          # deployment tag would name a commit the author never pushed (issue
          # #46). This workflow only runs on `pull_request`, so the payload
          # always exists.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Passed through the environment, never interpolated into the script:
          # a pull request title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pnpm exec wrangler preview \
            --env="" \
            --name "$PREVIEW_ALIAS" \
            --ignore-base-config \
            --secrets-file "$RUNNER_TEMP/api-preview-secrets.json" \
            --message "PR #$PR_NUMBER: $PR_TITLE" \
            --tag "${PREVIEW_ALIAS}-${HEAD_SHA:0:7}" \
            --json > "$RUNNER_TEMP/api-preview.json"

          reported=$(jq -r '.preview.urls[0] // empty' "$RUNNER_TEMP/api-preview.json")
          if [ "$reported" != "$API_PREVIEW_URL" ]; then
            echo "::error::wrangler reported the Preview URL '$reported', not '$API_PREVIEW_URL', which the secrets file and the web build use."
            exit 1
          fi
          echo "Deployed Worker Preview '$PREVIEW_ALIAS' at $reported"

      # Pages Preview environment variables are shared across every preview
      # deployment, so the per-PR API URL is injected at build time instead —
      # resolveApiUrl() prefers it over the shared Pages API_URL binding.
      #
      # Routed through turbo (not `--filter @vmb/web build`) so it shares the
      # remote cache with CI. `build`'s env declares PUBLIC_API_URL, so this
      # per-PR hash can never restore the production (URL-less) entry.
      - name: Build web with this PR's API URL
        if: steps.changes.outputs.code_changed != 'false'
        env:
          PUBLIC_API_URL: ${{ steps.ids.outputs.api_url }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm turbo build --filter=@vmb/web

      - name: Deploy web preview
        if: steps.changes.outputs.code_changed != 'false'
        id: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.ids.outputs.alias }}
          # Same head commit as the API deployment tag above (issue #46).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Same identifier as the API Preview name, so the Pages branch alias
          # and the Worker Preview line up where Cloudflare lets them. The commit
          # metadata makes the Cloudflare Pages dashboard readable.
          set -o pipefail
          pnpm --filter @vmb/web exec wrangler pages deploy .svelte-kit/cloudflare \
            --branch "$PREVIEW_ALIAS" \
            --commit-message "$PR_TITLE" \
            --commit-hash "$HEAD_SHA" 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"

          # Cloudflare owns the Pages branch alias, and it is not a pure
          # function of the `--branch` passed: it lowercases and truncates to 28
          # characters, and appends a short suffix when that alias is already
          # taken (seen on PR #156, where an earlier run's longer alias
          # truncated onto the same string and the next one became `…-15b2`).
          # So post the URL wrangler reports, not one computed from the alias —
          # a stale link a reviewer cannot open is worse than this parse
          # (issue #155). A URL that is not a Pages URL means the output shape
          # changed; warn, and fall back to the deployment URL, which is the
          # atomic one Pages printed and always resolves.
          alias_url=$(sed -n 's/.*Deployment alias URL: \(https:\/\/[^[:space:]]*\)[[:space:]]*$/\1/p' \
            "$RUNNER_TEMP/pages-deploy.log" | tail -n 1)
          case "$alias_url" in
          https://*.vmb-web.pages.dev) ;;
          *)
            echo "::warning::wrangler did not report a Pages alias URL; posting the deployment URL instead."
            alias_url=$(sed -n 's/.*Take a peek over at \(https:\/\/[^[:space:]]*\)[[:space:]]*$/\1/p' \
              "$RUNNER_TEMP/pages-deploy.log" | tail -n 1)
            ;;
          esac
          echo "web_url=$alias_url" >> "$GITHUB_OUTPUT"

      # The URLs live in the sticky comment, but a GitHub deployment also puts a
      # "View deployment" button in the pull request timeline and an entry on the
      # repository's Deployments page (issue #154). Registered through the
      # Deployments API rather than a job-level `environment:` key, for the two
      # reasons this workflow has already paid for once: the deployment can name
      # the PR's head commit instead of the synthetic merge commit (issue #46),
      # and its URL can be the one wrangler reported for this run (issue #155)
      # instead of a job-level expression, which cannot see a step output.
      #
      # Best-effort, like the prune below and unlike the deploys above: the
      # comment already carries both URLs, so a failed registration costs the
      # timeline affordance and nothing else. GitHub's default shell runs
      # `bash -e`, so errexit is cleared explicitly and each call is checked by
      # hand; the next push or the close-time Cleanup reconciles a miss.
      #
      # `required_contexts: []` is load-bearing: without it the create-deployment
      # API refuses (409) until the ref's commit statuses pass, and a preview
      # runs before they do. `transient_environment` is left at its default
      # (false) so GitHub's automatic inactivate-the-previous rule applies to
      # each push — transient deployments are excluded from it (measured: a
      # second successful transient deployment leaves the first's success status
      # untouched) — and the flag's other effect, the "destroyed" state a status
      # can carry, is moot because cleanup.yml deletes the environment itself.
      # `production_environment: false` keeps the preview out of the production
      # rollup (`environment` defaults it to true only for "production").
      - name: Register the web preview as a GitHub deployment
        if: steps.changes.outputs.code_changed != 'false' && steps.web.outputs.web_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_PREVIEW_URL: ${{ steps.web.outputs.web_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Passed through the environment, never interpolated into the script:
          # a pull request title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Best-effort by design: clear the runner's inherited `-e` so an
          # unexpected failure here cannot fail an otherwise-green deploy.
          set +e
          set -uo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # The shared module's environment name (issue #154), not a second
          # inline `preview/pr-` literal (issue #78).
          environment=$(preview_environment_name "$PR_NUMBER")
          # The API rejects a description longer than 140 characters; a pull
          # request title has no such limit.
          description=$(printf 'PR #%s: %s' "$PR_NUMBER" "$PR_TITLE" | cut -c1-140)

          deployment_id=$(jq -n \
            --arg ref "$HEAD_SHA" \
            --arg environment "$environment" \
            --arg description "$description" \
            '{ref: $ref, environment: $environment, description: $description,
              required_contexts: [], auto_merge: false,
              production_environment: false}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments" \
                --data @- \
            | jq -r '.id // ""') || deployment_id=""

          if [ -z "$deployment_id" ]; then
            echo "::warning::Could not register the preview as a GitHub deployment; the preview itself is unaffected."
            exit 0
          fi

          if ! jq -n \
            --arg environment_url "$WEB_PREVIEW_URL" \
            --arg log_url "$RUN_URL" \
            --arg description "$description" \
            '{state: "success", environment_url: $environment_url, log_url: $log_url, description: $description}' \
            | curl -fsS -o /dev/null -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --data @-; then
            echo "::warning::Deployment $deployment_id was registered but not marked successful; the preview itself is unaffected."
            exit 0
          fi

          echo "Registered deployment $deployment_id: $environment -> $WEB_PREVIEW_URL"

      # A Pages preview deployment is retained indefinitely and each push adds
      # another, so without this an open PR accumulates one deployment per push
      # until Cleanup sweeps them at close (issue #55). Prune after the deploy
      # succeeds, so this PR keeps only the deployment it just made; Cleanup at
      # close stays the safety net for anything this misses (issue #84).
      #
      # Matched by the same `pr<N>-` prefix / `pr-<N>` fallback Cleanup uses,
      # from `scripts/preview-identifiers.sh` (issue #78), through the shared
      # `scripts/pages-preview-deployments.sh` (issue #84), so the deployment
      # this run just created is the newest match and every older match is
      # superseded. Keeping the newest also keeps the deployment the branch
      # alias points at, so the live `pr<N>-<slug>.vmb-web.pages.dev` URL keeps
      # resolving after the older ones go (issue #84). If the list were ever
      # stale and the new deployment not yet visible, the newest visible match
      # is kept, so the prune never deletes a live deployment; the next push or
      # Cleanup reconciles.
      #
      # Best-effort, the opposite of Cleanup: a failed delete must not fail a
      # deploy that otherwise succeeded (issue #84). GitHub's default shell runs
      # `bash -e`, so errexit is cleared explicitly and every call is checked by
      # hand; a leaked deployment is reaped at close, which is cheaper than a
      # red deploy over a cleanup miss. The step runs only on the default
      # `success()`, so a failed deploy can't prune the live deployment away.
      - name: Prune superseded Pages preview deployments
        if: steps.changes.outputs.code_changed != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_NAME: vmb-web
        run: |
          # Best-effort by design: clear the runner's inherited `-e` so an
          # unexpected failure here cannot fail an otherwise-green deploy.
          set +e
          set -uo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # shellcheck source=scripts/pages-preview-deployments.sh
          . scripts/pages-preview-deployments.sh
          prefix=$(preview_prefix "$PR_NUMBER")
          fallback=$(preview_number_name "$PR_NUMBER")

          if ! deployments=$(pages_matching_deployments \
            "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$PROJECT_NAME" "$prefix" "$fallback"); then
            echo "::warning::Could not list this PR's Pages preview deployments; skipping the prune."
            exit 0
          fi

          if [ -z "$deployments" ]; then
            echo "No Pages preview deployments for PR #$PR_NUMBER — nothing to prune."
            exit 0
          fi

          # The helper returns `<created_on>\t<id>` lines, newest first. Keep the
          # first (the deployment this run just made) and delete the rest.
          superseded=$(printf '%s' "$deployments" | tail -n +2 | cut -f2)

          if [ -z "$superseded" ]; then
            echo "Only one Pages preview deployment for PR #$PR_NUMBER — nothing to prune."
            exit 0
          fi

          pruned=0
          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue

            # The helper explains a failure on stderr; warn and leave the
            # deployment for Cleanup rather than failing the deploy.
            if pages_delete_deployment \
              "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$PROJECT_NAME" "$deployment_id"; then
              pruned=$((pruned + 1))
            else
              echo "::warning::Pages deployment $deployment_id was not pruned; leaving it for Cleanup."
            fi
          done <<< "$superseded"

          echo "Pruned $pruned superseded Pages deployment(s); PR #$PR_NUMBER keeps only its newest."

      # Runs even when an earlier step failed, so a broken deploy updates the
      # same comment instead of leaving a stale green one. `job.status` is
      # "success", "failure" or "cancelled" at this point.
      - name: Update preview comment
        if: always() && steps.changes.outputs.code_changed != 'false'
        uses: actions/github-script@v9
        env:
          # The URL Cloudflare actually assigned this deployment (the deploy
          # step reads it from wrangler's output), falling back to the computed
          # one when the deploy itself failed — in which case the comment does
          # not print URLs anyway.
          WEB_PREVIEW_URL: ${{ steps.web.outputs.web_url || steps.ids.outputs.web_url }}
          API_PREVIEW_URL: ${{ steps.ids.outputs.api_url }}
          PREVIEW_NAME: ${{ steps.ids.outputs.alias }}
          NEON_BRANCH: ${{ steps.ids.outputs.neon_branch }}
          JOB_STATUS: ${{ job.status }}
          # The job-level names (see the job's `env:`) and the compare step's
          # outcome. An absent status means that step never ran — the run died
          # before migrations — so the schema section is omitted rather than
          # reported as unavailable; the step reports `unavailable` itself.
          NEON_DB_NAME: ${{ env.NEON_DB_NAME }}
          NEON_PARENT_BRANCH: ${{ env.NEON_PARENT_BRANCH }}
          SCHEMA_DIFF_STATUS: ${{ steps.schema_diff.outputs.status }}
          SCHEMA_DIFF_LINES: ${{ steps.schema_diff.outputs.lines }}
          SCHEMA_DIFF_TRUNCATED: ${{ steps.schema_diff.outputs.truncated }}
          SCHEMA_DIFF_EXCERPT_FILE: ${{ steps.schema_diff.outputs.excerpt_file }}
        with:
          script: |
            const marker = "<!-- preview-deployments -->";

            // A superseded run is cancelled by the concurrency group; leave the
            // comment to the newer run rather than briefly flashing a failure.
            if (process.env.JOB_STATUS === "cancelled") return;

            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            // The PR's head commit, like the deploy steps above (issue #46):
            // `context.sha` is the merge commit, so a link built from it names
            // code the author never pushed and 404s once the merge ref is gone.
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const commit = `[\`${shortSha}\`](${repoUrl}/commit/${sha})`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const branch = context.payload.pull_request.head.ref;
            const webUrl = process.env.WEB_PREVIEW_URL;
            const apiUrl = process.env.API_PREVIEW_URL;
            const previewName = process.env.PREVIEW_NAME;
            // The shared module's Neon name (via the Resolve step), not a
            // second inline definition (issue #78).
            const neonBranch = process.env.NEON_BRANCH;
            // The job-level names (see the job's `env:`), so this sentence and
            // the schema section cannot drift from what the branch was created
            // with (ADR-0029).
            const dbName = process.env.NEON_DB_NAME;
            const parentBranch = process.env.NEON_PARENT_BRANCH;

            const deployed = process.env.JOB_STATUS === "success" && webUrl && apiUrl;

            // The schema diff (issue #153) has three outcomes. `changed` reads
            // the excerpt the compare step wrote to a file — up to 200 lines,
            // which an environment variable would carry awkwardly and which
            // never needs shell quoting. `unavailable` is reported by that step
            // itself; with the URLs deployed the migrations must have run, so
            // an absent status means the step died before it could report and
            // "unavailable" is the honest answer. In a failed run an absent
            // status means the run died before migrations, so the section is
            // omitted rather than blamed on the diff.
            let schemaStatus = process.env.SCHEMA_DIFF_STATUS;
            if (!schemaStatus && deployed) schemaStatus = "unavailable";
            let schemaTruncated = process.env.SCHEMA_DIFF_TRUNCATED === "true";
            let schemaExcerpt = "";
            if (schemaStatus === "changed") {
              try {
                schemaExcerpt = require("fs").readFileSync(
                  process.env.SCHEMA_DIFF_EXCERPT_FILE,
                  "utf8",
                );
              } catch (error) {
                console.log(`Could not read the schema diff excerpt: ${error}`);
                schemaStatus = "unavailable";
              }
            }

            // Bound the excerpt by code points (not substring — a half-cut
            // multi-byte identifier would be invalid UTF-8) so the comment
            // stays clear of the API's 65,536-character body limit even if the
            // 200-line excerpt is made of very long lines.
            const maxDiffChars = 20000;
            let shownLines = 0;
            if (schemaStatus === "changed") {
              const codepoints = Array.from(schemaExcerpt.trimEnd());
              schemaExcerpt =
                codepoints.length > maxDiffChars
                  ? codepoints.slice(0, maxDiffChars).join("")
                  : codepoints.join("");
              schemaTruncated = schemaTruncated || codepoints.length > maxDiffChars;
              shownLines = schemaExcerpt.split("\n").length;
              // A `changed` status with nothing readable left is a broken
              // excerpt, not a reason to render an empty block.
              if (schemaExcerpt.trim() === "") schemaStatus = "unavailable";
            }

            const schemaLines = Number(process.env.SCHEMA_DIFF_LINES || "0");
            const schemaSection = [];
            if (schemaStatus === "changed") {
              const scope = schemaTruncated
                ? `first ${shownLines} of ${schemaLines} lines`
                : `${schemaLines} lines`;
              // A migration is PR-authored text: a backtick run longer than the
              // opening fence would close it and leak the rest of the diff into
              // the comment as markdown, so the fence outruns whatever the
              // excerpt contains.
              let longestBacktickRun = 3;
              for (const run of schemaExcerpt.matchAll(/`+/g)) {
                longestBacktickRun = Math.max(longestBacktickRun, run[0].length);
              }
              const fence = "`".repeat(longestBacktickRun + 1);
              schemaSection.push(
                "<details>",
                `<summary>Schema diff against \`${parentBranch}\` (${scope})</summary>`,
                "",
                `${fence}diff`,
                schemaExcerpt,
                fence,
              );
              if (schemaTruncated) {
                schemaSection.push(
                  "",
                  `The diff is truncated — the full diff is in the [workflow run](${runUrl}) log.`,
                );
              }
              schemaSection.push("", "</details>");
            } else if (schemaStatus === "unchanged") {
              // "No schema changes" is the useful statement and the exact one:
              // the comparison is against the parent's current head, which is
              // not necessarily the fork point a reused branch started from.
              schemaSection.push(
                `No schema changes: the preview branch's schema matches \`${parentBranch}\`.`,
              );
            } else if (schemaStatus === "unavailable") {
              schemaSection.push(
                `The schema diff against \`${parentBranch}\` was unavailable for this run — see the [workflow run](${runUrl}).`,
              );
            }

            const lines = deployed
              ? [
                  marker,
                  "## Preview environment",
                  "",
                  `Deployed commit ${commit} on \`${branch}\`.`,
                  "",
                  "| App | URL |",
                  "| --- | --- |",
                  `| Web preview | ${webUrl} |`,
                  `| API preview | ${apiUrl} |`,
                  `| API health | ${apiUrl}/health |`,
                  "",
                  `API logs, including the emails a preview logs instead of sending (OTP codes too), are in the Cloudflare dashboard: \`vmb-api\`, switch the environment from Production to \`${previewName}\`, then **Observability**.`,
                  "",
                  `The preview API runs on the application database \`${dbName}\` in an isolated Neon branch (\`${neonBranch}\`), which is deleted when this pull request closes.`,
                ]
              : [
                  marker,
                  "## Preview environment",
                  "",
                  `The preview deploy did not finish, so the URLs below the last successful run may be stale.`,
                  "",
                  `Commit ${commit} on \`${branch}\`. [Workflow run](${runUrl})`,
                  "",
                  "Push a new commit, or re-run the workflow, to try again.",
                ];

            // The section renders for both bodies: a diff computed before a
            // later step failed is still what this PR does to the schema.
            if (schemaSection.length > 0) {
              lines.push("", ...schemaSection);
            }

            if (deployed) {
              lines.push("", `<sub>This comment updates on every push. [Workflow run](${runUrl})</sub>`);
            }

            const body = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
