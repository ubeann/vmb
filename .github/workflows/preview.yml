name: Preview

# Per-PR preview environment (issue #23): a live `apps/api` Worker version, a
# live `apps/web` Pages deployment, and an isolated Neon branch — so migrations
# and the full stack get a real dry run before merging, without touching
# production or a shared staging database.
#
# The three identifiers — the Workers alias / Pages branch (`pr<N>-<slug>` or
# the `pr-<N>` fallback), the Pages deployment prefix (`pr<N>-`), and the Neon
# branch (`pr-<N>`) — come from `scripts/preview-identifiers.sh`, the one
# definition this workflow shares with cleanup.yml (issue #78). All three are
# idempotent per PR:
#   - API:   https://pr<N>-<slug>-vmb-api.<account>.workers.dev  (Workers preview alias)
#   - Web:   https://pr<N>-<slug>.vmb-web.pages.dev              (Pages branch alias)
#   - DB:    Neon branch named `pr-<N>`                          (see the Resolve step)
#
# Two preview resources aren't self-cleaning: the Neon branch and the Pages
# deployment(s). The Pages side is pruned here after each successful deploy so
# an open PR keeps only its newest deployment (issue #84); cleanup.yml is the
# close-time safety net that deletes the Neon branch and any Pages deployment
# this prune left behind. The Workers preview alias needs nothing — aliases are
# LRU-pruned past 1000 concurrent ones and the version behind an alias is
# CF-retained (issue #55). See cleanup.yml for the full three-way distinction.
#
# Whether a PR gets a preview at all is decided by the `Detect code-relevant
# changes` job, not a trigger-level `paths` filter. The canonical
# "code-relevant change" definition lives in `scripts/code-relevant-paths.sh`
# (issue #83), and a workflow's `on.paths` cannot reference a shared value — as
# a hand-kept copy it could only drift from `ci.yml`'s deploy gate (issue #70,
# ADR-0019). The job gates the preview job, so a docs-only PR pays one cheap,
# secret-free job instead of starting no run at all.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # No `paths` filter — see the header: the definition is shared from
    # `scripts/code-relevant-paths.sh` and consumed by the `changes` job below.
    # A docs-only PR still runs this workflow, but the preview job (the one that
    # holds secrets and creates Cloudflare/Neon resources) is skipped before it
    # starts.

# Shared with cleanup.yml's `pull_request: closed` run. Closing a PR
# therefore cancels any in-flight preview deploy in this group *before* the
# cleanup deletes the Neon branch, so a half-finished run can't create the
# branch after deletion and leak it. Otherwise, a new push cancels this PR's
# superseded preview run; the branch is reused, not recreated.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to post/update the sticky preview-URLs comment.
  pull-requests: write

jobs:
  # Decides whether this PR is code-relevant before the secret-bearing preview
  # job starts. Secret-free by design — it only diffs the checkout — so it also
  # runs for Dependabot PRs whose preview is skipped below (issue #45).
  changes:
    name: Detect Code-Relevant Changes
    runs-on: ubuntu-latest
    # The workflow grants `pull-requests: write` for the preview job's sticky
    # comment; this job needs only the checkout.
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7

      # The canonical definition is `scripts/code-relevant-paths.sh`; the
      # `preview` mode adds `.github/workflows/**`, because a workflow edit
      # cannot change the deployed artifact but still has to be exercised by the
      # PR's own preview before it lands (ADR-0023, issue #83).
      - name: Detect code-relevant changes
        id: changes
        env:
          # The default checkout is the test merge commit, whose first parent is
          # the PR's base commit — the baseline the diff is measured against.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # shellcheck source=scripts/code-relevant-paths.sh
          . scripts/code-relevant-paths.sh

          # A depth-1 clone carries the merge commit but not its parent. Fetch
          # the base commit so the diff can name it; if the fetch fails the
          # module returns "undetermined" (2) and the preview runs (fail open),
          # so the warning below is not a silent skip.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" \
              || echo "::warning::Could not fetch the base commit $BASE_SHA; running the preview to be safe."
          fi

          emit_code_relevant_change "$BASE_SHA" HEAD preview

  preview:
    name: Create Environment
    runs-on: ubuntu-latest
    needs: changes
    # Dependabot-triggered runs receive no Actions secrets, and this job cannot
    # work without them: `Resolve preview URLs` 404s on an empty
    # CLOUDFLARE_API_TOKEN, and the Neon and fnox steps need their secrets too.
    # Rather than fail for a reason unrelated to the bump, skip it entirely
    # (issue #45).
    #
    # Skipping is also the safer choice: a run whose purpose is to install and
    # build freshly-bumped third-party code should not hold
    # CLOUDFLARE_API_TOKEN (which deploys production) or FNOX_AGE_KEY (which
    # unlocks every dev secret in the committed store). The job cannot be made
    # secret-free — it needs Neon and Cloudflare — so there is no narrower
    # option. See ADR-0020.
    #
    # "Dependabot" is detected by the triggering actor *or* the pull request
    # author, so a maintainer re-run or a push to the branch cannot flip a
    # Dependabot PR onto the secret path.
    #
    # GitHub counts a conditionally-skipped job as satisfying a required check
    # (it concludes `skipped`, which branch protection treats as success), so
    # this does not wall Dependabot PRs off from merging. Because no Neon
    # branch is created here, cleanup.yml has nothing to delete for them either
    # and skips them the same way.
    #
    # A docs-only PR skips this job the same way: `changes` above concludes
    # `code_changed=false` and no secret-bearing runner starts (issue #83).
    #
    # Fail open, like the deploy gate: `!cancelled()` lets this job run when
    # `changes` itself failed, and an absent output is not `false`, so a broken
    # `changes` job runs the preview rather than silently skipping a code PR.
    if: "!cancelled() && needs.changes.outputs.code_changed != 'false' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Toolchain, pnpm store cache, and a frozen-lockfile install: the same
      # composite action `ci.yml` bootstraps with (issue #79).
      - uses: ./.github/actions/setup

      # The alias, the Pages prefix, and the Neon branch name all come from
      # `scripts/preview-identifiers.sh` (issue #78), so create and destroy
      # read one definition. The alias is sanitized from the branch name the
      # way Cloudflare does, capped so `<alias>-vmb-api` stays inside the
      # 63-char DNS label limit, and falls back to `pr-<N>` when the branch
      # name sanitizes to nothing.
      #
      # The account's workers.dev subdomain is not known to the workflow —
      # read it from the Cloudflare API rather than a hardcoded repo variable.
      # (`<ALIAS>-<WORKER_NAME>.<SUBDOMAIN>.workers.dev`, per Cloudflare's
      # preview-URL docs.)
      - name: Resolve preview identifiers
        id: ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed through the environment, never interpolated into the script:
          # a branch name is attacker-controlled text.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh

          subdomain=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // ""')

          if [ -z "$subdomain" ]; then
            echo "::error::Could not resolve the account's workers.dev subdomain — check CLOUDFLARE_API_TOKEN's Workers scope."
            exit 1
          fi

          alias=$(preview_alias "$PR_NUMBER" "$HEAD_REF")
          neon_branch=$(preview_neon_branch "$PR_NUMBER")

          # Safety net for a run that dies before cleanup.yml sees the PR close
          # (issue #118): the branch expires 30 days after creation, longer than
          # any plausible PR lifetime. `expires_at` is honoured only when the
          # branch is created — a re-push to an older PR reuses the existing
          # branch and keeps its original deadline.
          neon_expires_at=$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "alias=$alias"
            echo "neon_branch=$neon_branch"
            echo "neon_expires_at=$neon_expires_at"
            echo "api_url=https://${alias}-vmb-api.${subdomain}.workers.dev"
            echo "web_url=https://${alias}.vmb-web.pages.dev"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved preview alias: $alias"
          echo "Resolved Neon branch: $neon_branch"

      # Idempotent: if a branch named `pr-<N>` already exists (a re-push to the
      # same PR), the action returns the existing branch instead of failing.
      # The name comes from the shared module (via the Resolve step), not a
      # second inline definition (issue #78).
      #
      # `database` and `parent_branch` are pinned rather than left to the
      # action's defaults (`neondb` and the project's default branch), so the
      # preview's contract with production is explicit (issue #118):
      #
      #   - `database: vmb` is the database production runs on. `db_url` feeds
      #     both the migration step and the preview Worker's DATABASE_URL, so
      #     the default pointed both at `neondb`, a database production never
      #     migrates.
      #   - `parent_branch: production` makes the fork point a decision. The
      #     project default is production today, but left implicit a
      #     project-default change would silently repoint every preview.
      #
      # `branch_type` stays `default` (copy-on-write, rows included): the
      # parent's `drizzle.__drizzle_migrations` journal travels with the
      # schema, so `db:migrate` applies only what's new. `schema-only` would
      # arrive with an empty journal and replay from `0000`.
      #
      # `expires_at` (30 days, computed in the Resolve step) is the cleanup
      # safety net a leaked branch needs if a run dies before cleanup.yml sees
      # the PR close: it deletes itself rather than surviving unreaped.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ steps.ids.outputs.neon_branch }}
          database: vmb
          parent_branch: production
          expires_at: ${{ steps.ids.outputs.neon_expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run database migrations against the PR's Neon branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @vmb/db db:migrate

      # The branch inherits production's rows — `branch_type` stays `default`
      # so the migration journal travels with the schema (see the Create Neon
      # branch step) — and this is where those rows stop being production's
      # (issue #120). Every run replaces every row in the five application
      # schemas with deterministic fixtures, so a preview URL never serves a
      # production record and every push starts from the same dataset. Running
      # on every push rather than only at branch creation is deliberate: the
      # branch is reused across pushes, and a deterministic dataset every time
      # is the seeder's whole point. The wipe and the inserts are one
      # transaction, so a failed seed rolls back and fails this job before any
      # version is uploaded — never a live, half-emptied preview.
      - name: Seed the PR's Neon branch with deterministic fixtures
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @vmb/db db:seed

      # Shared secrets (BETTER_AUTH_SECRET, RESEND_API_KEY, EMAIL_FROM) come from
      # the committed fnox store, same as build-and-test in ci.yml. ADR-0011
      # keeps fnox to local/CI secrets and out of Worker runtime, so this is the
      # narrow exception ADR-0019 records: fnox feeds only this ephemeral
      # preview version, never the production deployment.
      #
      # The three per-PR values — DATABASE_URL, BETTER_AUTH_URL, WEB_URL — are
      # overridden so the preview Worker talks only to this PR's database and
      # accepts the preview web origin (Better Auth `baseURL`/`trustedOrigins`
      # and the auth route's CORS allowlist all read these).
      #
      # Written as JSON so Neon's connection string and any special characters
      # survive intact; `--secrets-file` keeps them out of argv/logs.
      - name: Assemble API preview secrets
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          # fnox exits 0 with empty values when FNOX_AGE_KEY can't decrypt;
          # error keeps a broken/missing key from silently shipping empties.
          FNOX_IF_MISSING: error
          NEON_DB_URL: ${{ steps.neon.outputs.db_url }}
          API_PREVIEW_URL: ${{ steps.ids.outputs.api_url }}
          WEB_PREVIEW_URL: ${{ steps.ids.outputs.web_url }}
        run: |
          set -euo pipefail

          # `fnox get`, not `fnox export -f env` — the export writes
          # `export KEY=value` lines (plus comment headers), so grepping
          # `^KEY=` finds nothing. get returns the raw value, and with
          # FNOX_IF_MISSING: error an unresolvable key fails here, not as "".
          better_auth_secret=$(fnox get BETTER_AUTH_SECRET)
          resend_api_key=$(fnox get RESEND_API_KEY)
          email_from=$(fnox get EMAIL_FROM)

          jq -n \
            --arg DATABASE_URL "$NEON_DB_URL" \
            --arg BETTER_AUTH_SECRET "$better_auth_secret" \
            --arg BETTER_AUTH_URL "$API_PREVIEW_URL" \
            --arg WEB_URL "$WEB_PREVIEW_URL" \
            --arg RESEND_API_KEY "$resend_api_key" \
            --arg EMAIL_FROM "$email_from" \
            '{
              DATABASE_URL: $DATABASE_URL,
              BETTER_AUTH_SECRET: $BETTER_AUTH_SECRET,
              BETTER_AUTH_URL: $BETTER_AUTH_URL,
              WEB_URL: $WEB_URL,
              RESEND_API_KEY: $RESEND_API_KEY,
              EMAIL_FROM: $EMAIL_FROM
            }' > "$RUNNER_TEMP/api-preview-secrets.json"

          for key in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL WEB_URL RESEND_API_KEY EMAIL_FROM; do
            value=$(jq -r --arg key "$key" '.[$key]' "$RUNNER_TEMP/api-preview-secrets.json")
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::$key resolved to an empty value — check the fnox store / create-branch output."
              exit 1
            fi
          done

      # `versions upload` (not `deploy`) uploads a version without shifting
      # production traffic; `--preview-alias` gives that version a stable URL
      # for the life of the PR. No cleanup needed — aliases are only LRU-pruned
      # past 1000 concurrent aliases, and the version behind one is CF-retained
      # (issue #55). The Pages deployment below is a different story; see
      # cleanup.yml.
      #
      # `--env=""` states the top-level (production) Worker explicitly. Without
      # it wrangler warns, because wrangler.toml defines [env.staging]; the
      # preview version must attach to vmb-api, not vmb-api-staging, for the
      # `<alias>-vmb-api.<subdomain>.workers.dev` URL below to resolve.
      - name: Deploy API preview version
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ALIAS: ${{ steps.ids.outputs.alias }}
          # The PR's head commit, not `GITHUB_SHA`. On `pull_request` the latter
          # is the synthetic merge commit (`refs/pull/<n>/merge`), so the version
          # tag would name a commit the author never pushed (issue #46). This
          # workflow only runs on `pull_request`, so the payload always exists.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Passed through the environment, never interpolated into the script:
          # a pull request title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm exec wrangler versions upload \
            --env="" \
            --preview-alias "$PREVIEW_ALIAS" \
            --secrets-file "$RUNNER_TEMP/api-preview-secrets.json" \
            --message "PR #$PR_NUMBER: $PR_TITLE" \
            --tag "${PREVIEW_ALIAS}-${HEAD_SHA:0:7}"

      # Pages Preview environment variables are shared across every preview
      # deployment, so the per-PR API URL is injected at build time instead —
      # resolveApiUrl() prefers it over the shared Pages API_URL binding.
      #
      # Routed through turbo (not `--filter @vmb/web build`) so it shares the
      # remote cache with CI. `build`'s env declares PUBLIC_API_URL, so this
      # per-PR hash can never restore the production (URL-less) entry.
      - name: Build web with this PR's API URL
        env:
          PUBLIC_API_URL: ${{ steps.ids.outputs.api_url }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm turbo build --filter=@vmb/web

      - name: Deploy web preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.ids.outputs.alias }}
          # Same head commit as the API version tag above (issue #46).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Same identifier as the API alias, so the Pages branch alias and the
          # Workers preview alias line up. The commit metadata makes the
          # Cloudflare Pages dashboard readable.
          pnpm --filter @vmb/web exec wrangler pages deploy .svelte-kit/cloudflare \
            --branch "$PREVIEW_ALIAS" \
            --commit-message "$PR_TITLE" \
            --commit-hash "$HEAD_SHA"

      # A Pages preview deployment is retained indefinitely and each push adds
      # another, so without this an open PR accumulates one deployment per push
      # until Cleanup sweeps them at close (issue #55). Prune after the deploy
      # succeeds, so this PR keeps only the deployment it just made; Cleanup at
      # close stays the safety net for anything this misses (issue #84).
      #
      # Matched by the same `pr<N>-` prefix / `pr-<N>` fallback Cleanup uses,
      # from `scripts/preview-identifiers.sh` (issue #78), through the shared
      # `scripts/pages-preview-deployments.sh` (issue #84), so the deployment
      # this run just created is the newest match and every older match is
      # superseded. Keeping the newest also keeps the deployment the branch
      # alias points at, so the live `pr<N>-<slug>.vmb-web.pages.dev` URL keeps
      # resolving after the older ones go (issue #84). If the list were ever
      # stale and the new deployment not yet visible, the newest visible match
      # is kept, so the prune never deletes a live deployment; the next push or
      # Cleanup reconciles.
      #
      # Best-effort, the opposite of Cleanup: a failed delete must not fail a
      # deploy that otherwise succeeded (issue #84). GitHub's default shell runs
      # `bash -e`, so errexit is cleared explicitly and every call is checked by
      # hand; a leaked deployment is reaped at close, which is cheaper than a
      # red deploy over a cleanup miss. The step runs only on the default
      # `success()`, so a failed deploy can't prune the live deployment away.
      - name: Prune superseded Pages preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_NAME: vmb-web
        run: |
          # Best-effort by design: clear the runner's inherited `-e` so an
          # unexpected failure here cannot fail an otherwise-green deploy.
          set +e
          set -uo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # shellcheck source=scripts/pages-preview-deployments.sh
          . scripts/pages-preview-deployments.sh
          prefix=$(preview_pages_prefix "$PR_NUMBER")
          fallback=$(preview_neon_branch "$PR_NUMBER")

          if ! deployments=$(pages_matching_deployments \
            "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$PROJECT_NAME" "$prefix" "$fallback"); then
            echo "::warning::Could not list this PR's Pages preview deployments; skipping the prune."
            exit 0
          fi

          if [ -z "$deployments" ]; then
            echo "No Pages preview deployments for PR #$PR_NUMBER — nothing to prune."
            exit 0
          fi

          # The helper returns `<created_on>\t<id>` lines, newest first. Keep the
          # first (the deployment this run just made) and delete the rest.
          superseded=$(printf '%s' "$deployments" | tail -n +2 | cut -f2)

          if [ -z "$superseded" ]; then
            echo "Only one Pages preview deployment for PR #$PR_NUMBER — nothing to prune."
            exit 0
          fi

          pruned=0
          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue

            # The helper explains a failure on stderr; warn and leave the
            # deployment for Cleanup rather than failing the deploy.
            if pages_delete_deployment \
              "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$PROJECT_NAME" "$deployment_id"; then
              pruned=$((pruned + 1))
            else
              echo "::warning::Pages deployment $deployment_id was not pruned; leaving it for Cleanup."
            fi
          done <<< "$superseded"

          echo "Pruned $pruned superseded Pages deployment(s); PR #$PR_NUMBER keeps only its newest."

      # Runs even when an earlier step failed, so a broken deploy updates the
      # same comment instead of leaving a stale green one. `job.status` is
      # "success", "failure" or "cancelled" at this point.
      - name: Update preview comment
        if: always()
        uses: actions/github-script@v9
        env:
          WEB_PREVIEW_URL: ${{ steps.ids.outputs.web_url }}
          API_PREVIEW_URL: ${{ steps.ids.outputs.api_url }}
          NEON_BRANCH: ${{ steps.ids.outputs.neon_branch }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = "<!-- preview-deployments -->";

            // A superseded run is cancelled by the concurrency group; leave the
            // comment to the newer run rather than briefly flashing a failure.
            if (process.env.JOB_STATUS === "cancelled") return;

            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            // The PR's head commit, like the deploy steps above (issue #46):
            // `context.sha` is the merge commit, so a link built from it names
            // code the author never pushed and 404s once the merge ref is gone.
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const commit = `[\`${shortSha}\`](${repoUrl}/commit/${sha})`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const branch = context.payload.pull_request.head.ref;
            const webUrl = process.env.WEB_PREVIEW_URL;
            const apiUrl = process.env.API_PREVIEW_URL;
            // The shared module's Neon name (via the Resolve step), not a
            // second inline definition (issue #78).
            const neonBranch = process.env.NEON_BRANCH;

            const deployed = process.env.JOB_STATUS === "success" && webUrl && apiUrl;
            const body = deployed
              ? [
                  marker,
                  "## Preview environment",
                  "",
                  `Deployed commit ${commit} on \`${branch}\`.`,
                  "",
                  "| App | URL |",
                  "| --- | --- |",
                  `| Web preview | ${webUrl} |`,
                  `| API preview | ${apiUrl} |`,
                  `| API health | ${apiUrl}/health |`,
                  "",
                  `The preview API uses an isolated Neon branch (\`${neonBranch}\`), which is deleted when this pull request closes.`,
                  "",
                  `<sub>This comment updates on every push. [Workflow run](${runUrl})</sub>`,
                ].join("\n")
              : [
                  marker,
                  "## Preview environment",
                  "",
                  `The preview deploy did not finish, so the URLs below the last successful run may be stale.`,
                  "",
                  `Commit ${commit} on \`${branch}\`. [Workflow run](${runUrl})`,
                  "",
                  "Push a new commit, or re-run the workflow, to try again.",
                ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
