name: Cleanup

# The teardown half of preview.yml. Four per-PR preview resources are not
# self-cleaning and are deleted here (issue #55):
#   - Neon branch — Neon caps branches per project, so a leaked branch blocks
#     new previews. Deleted on close.
#   - Pages preview deployment — retained indefinitely, and every push to a PR
#     (and every branch rename) creates another. `preview.yml` prunes the
#     superseded ones after each successful deploy so an open PR keeps one
#     (issue #84); this close-time sweep is the safety net that deletes the
#     last one and anything the prune left behind. Every one is deleted (issue
#     #68); there is no protected residual.
#   - GitHub deployment environment — naming one in a deployment auto-creates
#     it and GitHub never reaps it, so a per-PR environment would accumulate
#     one per pull request forever (issue #154). Deleted on close; this is the
#     one delete that needs an admin-capable token, because GITHUB_TOKEN cannot
#     be granted Administration: write.
#   - Worker Preview — the PR's `vmb-api` Preview, with the PR's secrets.
#     Cloudflare prunes the least recently deployed past its per-Worker cap,
#     but deleting on close takes a closed PR's API offline (ADR-0019's
#     2026-10-07 amendment).
# Previews before that amendment were version URLs with an alias, which need
# no cleanup: aliases are LRU-pruned past 1000 concurrent ones, and the
# versions behind them have no supported individual delete (issues #55, #152).
#
# Runs on `closed`, which covers both merged and closed-without-merge. All four
# lookups make this idempotent: if the preview workflow never got as far as
# creating the resource (or it was already removed), there's nothing to delete
# and the job succeeds quietly instead of erroring on a 404.

on:
  pull_request:
    types: [closed]
    # Deliberately unfiltered. A `paths` filter (mirroring preview.yml's) would
    # skip Cleanup for a PR whose final diff is docs-only — but Preview can have
    # created a Neon branch and Pages deployments on an earlier push, before the
    # code was reverted. Path filters evaluate the current base…head diff, not
    # the union over history, so that branch would leak (issue #66). The job is
    # idempotent and cheap, so it runs on every close.
    #
    # This is the one preview trigger that deliberately opts out of the
    # "code-relevant change" definition (ADR-0019, issue #83): filtered or not,
    # it must run on every close to reap whatever an earlier push created, and
    # filtering it would leak again exactly as issue #66 describes.

# Shares preview.yml's concurrency group on purpose: closing a PR normally
# cancels any in-flight preview deploy here before deleting, so a cancelled run
# is unlikely to create a resource after deletion and leak it. GitHub documents
# same-group ordering as not guaranteed — the queued cleanup can start before
# the running preview is cancelled — so this is the normal path, not a promise.
# The Neon branch's `expires_at`, renewed on every preview run through the API's
# PATCH (issue #150), is the backstop for a branch that slips through the race,
# and this job's delete is idempotent, so a re-run or a late lookup is harmless.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to mark this PR's deployments inactive before the environment they
  # belong to is deleted. `GITHUB_TOKEN` can hold this one; deleting the
  # environment itself cannot be done with any GITHUB_TOKEN permission.
  deployments: write

jobs:
  cleanup:
    name: Destroy Preview Resources
    runs-on: ubuntu-latest
    # Dependabot-authored PRs never get a Preview environment (preview.yml
    # skips them), so there is no Neon branch or Pages deployment to delete for
    # them — and their runs carry no Actions secrets, so the lookups below would
    # fail on an empty NEON_API_KEY / CLOUDFLARE_API_TOKEN. Skip on either
    # signal, actor or PR author, rather than fail for a reason unrelated to the
    # change (issue #45).
    #
    # Fork PRs are skipped the same way (issue #149, ADR-0030): no repository
    # secrets reach a fork's run either, and preview.yml's guard means it created
    # no Neon branch or Pages deployment to delete — nothing leaks by skipping.
    # preview.yml carries the full reasoning next to the same guard.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      # Needed so the job can source the two shared modules preview.yml also
      # uses: `scripts/preview-identifiers.sh`, the one definition of the names
      # it re-derives (issue #78); `scripts/pages-preview-deployments.sh`, the
      # shared Pages list-and-delete (issue #84); and
      # `scripts/neon-preview-branches.sh`, the shared Neon list, rename and
      # delete (ADR-0029). Cleanup previously inlined the `pr-<N>` Neon name and
      # the `pr<N>-` Pages prefix; sourcing the same definitions preview.yml
      # uses is what keeps create and destroy from drifting apart.
      - uses: actions/checkout@v7

      # Lookup and delete in one step. Deletion used to be delegated to
      # `neondatabase/delete-branch-action`, but that is a composite action that
      # pins `actions/setup-node` at a Node 20 commit, so every Cleanup run
      # carried a Node 20 deprecation warning (issue #33). The lookup was
      # already a direct API call, so the delete is one more of the same.
      #
      # Every match is deleted, not just the one named for the alias: the
      # branch's name moves when the PR is retitled, so a failed rename, a
      # cancelled race or a search that missed can leave a second branch under
      # the old slug. Matching by prefix is what stops that leaking (ADR-0029).
      - name: Find and delete this PR's Neon branches
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # shellcheck source=scripts/neon-preview-branches.sh
          . scripts/neon-preview-branches.sh

          matches=$(neon_matching_branches "$NEON_PROJECT_ID" "$NEON_API_KEY" "$PR_NUMBER")

          if [ -z "$matches" ]; then
            echo "No Neon branch for PR #$PR_NUMBER — nothing to delete."
            exit 0
          fi

          # Only the id is needed here; the name is the label the lookup matched
          # on, and the delete reports the id it acted on. One failure must not
          # strand the rest, so they are counted and the step still ends red:
          # a branch left behind is a real leak, reaped by nothing else before
          # its 30-day expiry.
          deleted=0
          failed=0
          while IFS=$'\t' read -r branch_id _; do
            [ -n "$branch_id" ] || continue

            if neon_delete_branch "$NEON_PROJECT_ID" "$NEON_API_KEY" "$branch_id"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done <<< "$matches"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed of $((deleted + failed)) Neon branch(es) for PR #$PR_NUMBER could not be deleted."
            exit 1
          fi

          echo "Deleted $deleted Neon branch(es) for PR #$PR_NUMBER."

      # Cloudflare never reaps a Pages preview deployment on its own: each push
      # to the PR creates another deployment for the branch, and every earlier
      # one is kept (issue #55). `preview.yml` prunes the superseded ones after
      # every successful deploy so an open PR holds one (issue #84); this sweep
      # is the close-time safety net that deletes the last one and any prune
      # miss.
      #
      # `preview.yml` names the deployment's branch `<alias>` — `pr<N>-<slug>`,
      # falling back to `pr-<N>` when nothing slugs (the title first, then the
      # source branch, per `scripts/preview-identifiers.sh`) — so every
      # deployment this PR ever made shares the `pr<N>-` prefix — including ones
      # orphaned by a branch rename (`pr<N>-<old>` → `pr<N>-<new>`), which a
      # branch-name lookup alone would miss. This is why cleanup keys on the PR
      # number rather than the current branch name. Both the prefix and the
      # fallback come from the shared module (issue #78).
      #
      # The list and delete calls come from
      # `scripts/pages-preview-deployments.sh` (issue #84), the same helper
      # `preview.yml` prunes with: pagination, the `per_page` cap, and the match
      # predicate live there once. This step still owns the failure policy —
      # unlike the prune, a delete failure here fails the run.
      #
      # Cloudflare's documentation says "the latest deployment for a branch
      # cannot be deleted", but in practice every match is deleted, latest
      # included, with `force=true`. Measured (issue #68): 2 of 2 for a two-push
      # PR (Cleanup run 35333457925) and 1 of 1 for a single-push PR (#67), 0
      # residuals both times. These runs cannot say whether the documented guard
      # simply does not apply to preview aliases or `force=true` lifts it — only
      # that deletion succeeds. So there is no protected residual to warn about,
      # and a delete status other than 2xx (or 404, already gone) is a real
      # failure: bad token, missing Pages Write scope, 5xx. ADR-0019 records it.
      #
      # Hand-rolled `curl` keeps the status and body inspectable, which is what
      # turned the guard assumption into a measurable claim; `wrangler pages
      # deployment delete` collapses a failure into a generic error.
      - name: Find and delete this PR's Pages preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_NAME: vmb-web
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          # shellcheck source=scripts/pages-preview-deployments.sh
          . scripts/pages-preview-deployments.sh
          prefix=$(preview_prefix "$PR_NUMBER")
          fallback=$(preview_number_name "$PR_NUMBER")

          if ! deployments=$(pages_matching_deployments \
            "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$PROJECT_NAME" "$prefix" "$fallback"); then
            echo "::error::Could not list this PR's Pages preview deployments."
            exit 1
          fi

          # The helper returns `<created_on>\t<id>` lines, newest first; this
          # sweep deletes every match, so only the id matters.
          deployment_ids=$(printf '%s' "$deployments" | cut -f2)

          if [ -z "$deployment_ids" ]; then
            echo "No Pages preview deployments for PR #$PR_NUMBER — nothing to delete."
            exit 0
          fi

          deleted=0
          failed=0
          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue

            # The helper prints the reason to stderr. A delete failure here is
            # real — auth, permissions, server error — and must fail the run
            # rather than pass as a green run that leaked. A curl-level failure
            # is counted and skipped rather than aborting the loop and leaving
            # the rest behind. 404 is not a failure: the helper returns 0 for it
            # (issue #68).
            if pages_delete_deployment \
              "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$PROJECT_NAME" "$deployment_id"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::error::Pages deployment $deployment_id failed to delete."
            fi
          done <<< "$deployment_ids"

          echo "Deleted $deleted Pages deployment(s)."
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Pages deployment(s) failed to delete."
            exit 1
          fi

      # The PR's Worker Preview (ADR-0019's 2026-10-07 amendment). Cloudflare
      # drops the least recently deployed Preview past 100 per Worker on the
      # free plan, so a miss is pruned eventually, but deleting on close keeps
      # a closed PR's API, and the Neon connection string in its secrets, off
      # the internet. Every Preview the PR made is matched by the shared
      # prefix/fallback rule (`preview_name_matches`), because a retitle
      # deploys to a new Preview name and leaves the old one behind.
      #
      # The list is paginated at the API's 100-per-page cap. A delete failure
      # fails the run, as the Pages sweep does; 404 means it is already gone.
      - name: Find and delete this PR's Worker Previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKER_NAME: vmb-api
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME/previews"
          previews=""
          page=1
          while :; do
            body=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100&page=$page")
            previews+=$(printf '%s' "$body" | jq -r '.result[] | "\(.id)\t\(.name)"')$'\n'
            total_pages=$(printf '%s' "$body" | jq -r '.result_info.total_pages // 1')
            [ "$page" -lt "$total_pages" ] || break
            page=$((page + 1))
          done

          deleted=0
          failed=0
          while IFS=$'\t' read -r preview_id preview_name; do
            [ -n "$preview_id" ] || continue
            preview_name_matches "$PR_NUMBER" "$preview_name" || continue

            status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$preview_id")
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ] || [ "$status" = 404 ]; then
              echo "Deleted Worker Preview '$preview_name'."
              deleted=$((deleted + 1))
            else
              echo "::error::Worker Preview '$preview_name' failed to delete (HTTP $status)."
              failed=$((failed + 1))
            fi
          done <<< "$previews"

          echo "Deleted $deleted Worker Preview(s) for PR #$PR_NUMBER."
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

      # The deployment records are history and stay; their state may not. The
      # Pages deployment the newest of them points at was deleted just above, so
      # a `success` status left behind would advertise a live preview for a
      # closed PR. GitHub's automatic inactivate-the-previous rule only fires
      # when a newer deployment succeeds in the same environment, which cannot
      # happen once the PR is closed, so the PR's deployments are marked
      # inactive here.
      #
      # Best-effort, unlike the sweeps around it: this is a status update, not a
      # reaping — nothing leaks if it fails, and the environment delete below
      # must not be skipped over a cosmetic miss. The deletes themselves stay
      # available if a future decision wants the records gone too (inactive
      # deployments are the deletable ones).
      - name: Deactivate this PR's GitHub deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Best-effort by design: clear the runner's inherited `-e` so a
          # failure here cannot skip the environment delete below.
          set +e
          set -uo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          environment=$(preview_environment_name "$PR_NUMBER")
          # A `/` is a path separator in the endpoint URL unless encoded, and the
          # name carries one.
          encoded=$(jq -rn --arg name "$environment" '$name|@uri')

          # The list is newest-first and `per_page` is the endpoint's maximum.
          deployment_ids=$(curl -fsS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?environment=$encoded&per_page=100" \
            | jq -r '.[].id') || deployment_ids=""

          if [ -z "$deployment_ids" ]; then
            echo "No deployments for preview environment '$environment' — nothing to deactivate."
            exit 0
          fi

          deactivated=0
          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue

            if curl -fsS -o /dev/null -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              --data '{"state":"inactive"}'; then
              deactivated=$((deactivated + 1))
            else
              echo "::warning::Deployment $deployment_id was not marked inactive; leaving its record to history."
            fi
          done <<< "$deployment_ids"

          echo "Marked $deactivated deployment(s) of '$environment' inactive."

      # GitHub auto-creates an environment when a deployment names one and never
      # deletes it, so without this every pull request would leave one behind
      # (issue #154). `preview.yml` registers the deployment under the name this
      # step re-derives from the shared module (issue #78) — number-keyed rather
      # than slugged, because this endpoint deletes by exact name and a retitle
      # would otherwise strand the environment it moved off.
      #
      # The delete needs a token that can administer the repository:
      # `DELETE /repos/{owner}/{repo}/environments/{name}` requires
      # Administration: write, which GITHUB_TOKEN cannot be granted (measured;
      # GitHub documents the permission and the default token has no such
      # grant). This is therefore the one preview step running on its own
      # credential, `PREVIEW_ENVIRONMENT_TOKEN`, and the only workflow that
      # needs it — `preview.yml` only creates.
      #
      # The name is URL-encoded because `preview/pr-<N>` carries a `/`, which
      # would otherwise route to a different endpoint and 404 (measured).
      #
      # 404 is not a failure: the PR may never have reached the registration
      # step, or the environment may already be gone — the same
      # nothing-to-delete case as the Neon branch above. Any other non-2xx is
      # real — missing or expired token, lost Administration scope, 5xx — and
      # fails the run like the Pages sweep above, so a green run cannot mean a
      # leaked environment.
      - name: Delete this PR's preview environment
        env:
          PREVIEW_ENVIRONMENT_TOKEN: ${{ secrets.PREVIEW_ENVIRONMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "$PREVIEW_ENVIRONMENT_TOKEN" ]; then
            echo "::error::PREVIEW_ENVIRONMENT_TOKEN is not set — the environment needs Administration: write, which GITHUB_TOKEN cannot be granted."
            exit 1
          fi

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          environment=$(preview_environment_name "$PR_NUMBER")
          encoded=$(jq -rn --arg name "$environment" '$name|@uri')

          # The body is kept so a failure can print the API's own reason
          # (`Resource not accessible by integration`, say) instead of a bare
          # status; `curl -f` would swallow it.
          body="$RUNNER_TEMP/environment-delete.json"
          status=$(curl -sS -o "$body" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $PREVIEW_ENVIRONMENT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/$encoded")

          case "$status" in
          204)
            echo "Deleted preview environment '$environment'."
            ;;
          404)
            echo "No preview environment '$environment' — nothing to delete."
            ;;
          *)
            echo "::error::Deleting preview environment '$environment' failed with HTTP $status: $(cat "$body")"
            exit 1
            ;;
          esac
