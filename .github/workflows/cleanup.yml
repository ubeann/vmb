name: Cleanup

# The teardown half of preview.yml. Two of the three per-PR preview resources
# are not self-cleaning and are deleted here (issue #55):
#   - Neon branch — Neon caps branches per project, so a leaked branch blocks
#     new previews.
#   - Pages preview deployment — retained indefinitely, and every push to a PR
#     (and every branch rename) creates another, so they accumulate until
#     explicitly deleted. Every one is deleted (issue #68); there is no
#     protected residual.
# The Workers preview alias needs no cleanup: aliases are LRU-pruned past 1000
# concurrent ones, and the version behind an alias is CF-retained with no
# supported individual delete (issue #55). That is the distinction the original
# "neither needs cleanup" claim collapsed.
#
# Runs on `closed`, which covers both merged and closed-without-merge. Both the
# Neon and Pages lookups make this idempotent: if the preview workflow never got
# as far as creating the resource (or it was already removed), there's nothing
# to delete and the job succeeds quietly instead of erroring on a 404.

on:
  pull_request:
    types: [closed]
    # Deliberately unfiltered. A `paths` filter (mirroring preview.yml's) would
    # skip Cleanup for a PR whose final diff is docs-only — but Preview can have
    # created a Neon branch and Pages deployments on an earlier push, before the
    # code was reverted. Path filters evaluate the current base…head diff, not
    # the union over history, so that branch would leak (issue #66). The job is
    # idempotent and cheap, so it runs on every close.
    #
    # This is the one preview trigger that deliberately opts out of the
    # "code-relevant change" definition (ADR-0019, issue #70): filtered or not,
    # it must run on every close to reap whatever an earlier push created, and
    # filtering it would leak again exactly as issue #66 describes.

# Shares preview.yml's concurrency group on purpose: closing a PR cancels any
# in-flight preview deploy here *before* deleting, so a cancelled run can't
# create a resource after deletion and leak it.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Destroy Preview Resources
    runs-on: ubuntu-latest
    # Dependabot-authored PRs never get a Preview environment (preview.yml
    # skips them), so there is no Neon branch or Pages deployment to delete for
    # them — and their runs carry no Actions secrets, so the lookups below would
    # fail on an empty NEON_API_KEY / CLOUDFLARE_API_TOKEN. Skip on either
    # signal, actor or PR author, rather than fail for a reason unrelated to the
    # change (issue #45).
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 10
    steps:
      # Needed so the job can source `scripts/preview-identifiers.sh`, the one
      # definition of the names it re-derives (issue #78). Cleanup previously
      # inlined the `pr-<N>` Neon name and the `pr<N>-` Pages prefix; sourcing
      # the same module preview.yml uses is what keeps create and destroy from
      # drifting apart.
      - uses: actions/checkout@v7

      # Lookup and delete in one step. Deletion used to be delegated to
      # `neondatabase/delete-branch-action`, but that is a composite action that
      # pins `actions/setup-node` at a Node 20 commit, so every Cleanup run
      # carried a Node 20 deprecation warning (issue #33). The lookup was
      # already a direct API call, so the delete is one more of the same.
      #
      # `search` narrows server-side because list-branches is cursor-paginated;
      # `limit` is well past any project's branch limit so the match can't fall
      # onto a second page and silently leak the branch.
      - name: Find and delete this PR's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          BRANCH_NAME=$(preview_neon_branch "$PR_NUMBER")

          branch_id=$(curl -fsS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches?limit=100&search=$BRANCH_NAME" \
            | jq -r --arg name "$BRANCH_NAME" '[.branches[] | select(.name == $name) | .id] | first // ""')

          if [ -z "$branch_id" ]; then
            echo "No Neon branch named '$BRANCH_NAME' — nothing to delete."
            exit 0
          fi

          echo "Deleting Neon branch '$BRANCH_NAME' ($branch_id)."
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$branch_id"

      # Pages preview deployments are never reaped on their own: each push to
      # the PR creates another deployment for the branch, and each earlier one
      # is retained (issue #55). `preview.yml` names the deployment's branch
      # `<alias>` (`pr<N>-<slug>`, or `pr-<N>` when the branch name sanitizes to
      # nothing), so every deployment this PR ever made shares the `pr<N>-`
      # prefix — including ones orphaned by a branch rename (`pr<N>-<old>` →
      # `pr<N>-<new>`), which a branch-name lookup alone would miss. This is why
      # cleanup keys on the PR number rather than the current branch name. Both
      # the prefix and the fallback come from the shared module (issue #78).
      #
      # The list endpoint is paginated, so the loop follows `total_pages`
      # instead of trusting the first page; a match on a later page would
      # otherwise leak.
      #
      # Cloudflare's documentation says "the latest deployment for a branch
      # cannot be deleted", but in practice every match is deleted, latest
      # included, with `force=true`. Measured (issue #68): 2 of 2 for a two-push
      # PR (Cleanup run 35333457925) and 1 of 1 for a single-push PR (#67), 0
      # residuals both times. These runs cannot say whether the documented guard
      # simply does not apply to preview aliases or `force=true` lifts it — only
      # that deletion succeeds. So there is no protected residual to warn about,
      # and a delete status other than 2xx (or 404, already gone) is a real
      # failure: bad token, missing Pages Write scope, 5xx. ADR-0019 records it.
      #
      # Hand-rolled `curl` keeps the status and body inspectable, which is what
      # turned the guard assumption into a measurable claim; `wrangler pages
      # deployment delete` collapses a failure into a generic error.
      - name: Find and delete this PR's Pages preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_NAME: vmb-web
        run: |
          set -euo pipefail

          # shellcheck source=scripts/preview-identifiers.sh
          . scripts/preview-identifiers.sh
          prefix=$(preview_pages_prefix "$PR_NUMBER")
          fallback=$(preview_neon_branch "$PR_NUMBER")
          deployment_ids=""

          page=1
          while :; do
            # `-sS` without `-f`: a non-2xx must stay inspectable so the
            # Cloudflare error body is printed, instead of collapsing to a bare
            # `curl: (22)` that says nothing about the cause (issue #66).
            #
            # `per_page` is pinned at 25, the Pages deployments endpoint's
            # hard ceiling — anything larger is rejected with a 400, which is
            # what made this step fail on every run since it landed. The API
            # reference documents the parameter but not the cap.
            if ! response=$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?env=preview&per_page=25&page=$page"); then
              echo "::error::Could not reach the Cloudflare API to list Pages deployments."
              exit 1
            fi

            status=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Listing Pages deployments failed (HTTP $status): $body"
              exit 1
            fi

            matches=$(printf '%s' "$body" \
              | jq -r --arg prefix "$prefix" --arg fallback "$fallback" \
                '.result[]? | select(((.deployment_trigger.metadata.branch // "") == $fallback) or ((.deployment_trigger.metadata.branch // "") | startswith($prefix))) | .id')

            if [ -n "$matches" ]; then
              deployment_ids="${deployment_ids}${matches}"$'\n'
            fi

            total_pages=$(printf '%s' "$body" | jq -r '.result_info.total_pages // 1')
            if [ "$page" -ge "$total_pages" ]; then
              break
            fi
            page=$((page + 1))
          done

          if [ -z "$deployment_ids" ]; then
            echo "No Pages preview deployments for PR #$PR_NUMBER — nothing to delete."
            exit 0
          fi

          deleted=0
          failed=0
          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue

            # `-sS` without `-f`, so a non-2xx status and body stay inspectable;
            # the status is appended as the last line. A curl-level failure
            # (DNS, TLS, network) is counted and skipped rather than aborting the
            # loop and leaving the remaining deployments behind.
            if ! response=$(curl -sS -w '\n%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments/$deployment_id?force=true"); then
              failed=$((failed + 1))
              echo "::error::Could not reach the Cloudflare API to delete Pages deployment $deployment_id."
              continue
            fi

            status=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')

            case "$status" in
              2??)
                deleted=$((deleted + 1))
                echo "Deleted Pages deployment $deployment_id."
                ;;
              404)
                # Already gone — another close-time run or a manual delete. Not
                # a failure.
                deleted=$((deleted + 1))
                echo "Pages deployment $deployment_id was already gone."
                ;;
              *)
                # Any other status — auth, permissions, server error — is a
                # real failure and must fail the run rather than pass as a green
                # run that leaked. 404 is handled above; there is no guard to
                # excuse (issue #68).
                failed=$((failed + 1))
                echo "::error::Failed to delete Pages deployment $deployment_id (HTTP $status): $body"
                ;;
            esac
          done <<< "$deployment_ids"

          echo "Deleted $deleted Pages deployment(s)."
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Pages deployment(s) failed to delete."
            exit 1
          fi
