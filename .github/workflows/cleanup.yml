name: Cleanup

# The teardown half of preview.yml. Tears down the one per-PR preview resource
# that isn't self-cleaning (issue #23): the Neon branch. Workers preview aliases
# and Pages preview deployments are left alone, per Cloudflare's docs — neither
# needs explicit cleanup.
#
# Runs on `closed`, which covers both merged and closed-without-merge. The
# branch-name lookup makes this idempotent: if the preview workflow never got
# as far as creating the branch (or it was already removed), there's nothing to
# delete and the job succeeds quietly instead of erroring on a 404.

on:
  pull_request:
    types: [closed]

# Shares preview.yml's concurrency group on purpose: closing a PR cancels any
# in-flight preview deploy here *before* deleting the branch, so a cancelled
# run can't create the branch after deletion and leak it.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  delete-neon-branch:
    name: Destroy Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Lookup and delete in one step. Deletion used to be delegated to
      # `neondatabase/delete-branch-action`, but that is a composite action that
      # pins `actions/setup-node` at a Node 20 commit, so every Cleanup run
      # carried a Node 20 deprecation warning (issue #33). The lookup was
      # already a direct API call, so the delete is one more of the same.
      #
      # `search` narrows server-side because list-branches is cursor-paginated;
      # `limit` is well past any project's branch limit so the match can't fall
      # onto a second page and silently leak the branch.
      - name: Find and delete this PR's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          branch_id=$(curl -fsS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches?limit=100&search=$BRANCH_NAME" \
            | jq -r --arg name "$BRANCH_NAME" '[.branches[] | select(.name == $name) | .id] | first // ""')

          if [ -z "$branch_id" ]; then
            echo "No Neon branch named '$BRANCH_NAME' — nothing to delete."
            exit 0
          fi

          echo "Deleting Neon branch '$BRANCH_NAME' ($branch_id)."
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$branch_id"
