name: Setup
description: >-
  Install the mise-pinned toolchain, restore the pnpm store cache, and install
  dependencies with a frozen lockfile — the bootstrap the build, test, release,
  and preview jobs share (issue #79).

inputs:
  install-args:
    description: >-
      Space-separated mise tools to install. Empty installs the full
      `.mise.toml` toolchain; a narrower job names only the tools it needs.
    required: false
    default: ""
  install-dependencies:
    description: >-
      Run `pnpm install --frozen-lockfile` against the restored store. Set to
      false for a job that needs no node_modules; it also skips the store
      cache, which cannot be resolved without pnpm on PATH.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # v5 installs the newest mise release at least a day old, the same wait
    # pnpm applies to packages (ADR-0047).
    - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        experimental: true
        install_args: ${{ inputs.install-args }}

    # The store path is only knowable once pnpm is on PATH, so the cache sits
    # below the toolchain install. Both steps share the `install-dependencies`
    # guard: a job that installs no dependencies needs neither.
    - name: Get pnpm store directory
      if: inputs.install-dependencies == 'true'
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - id: pnpm-store-cache
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # The store restored from a `restore-keys` prefix still holds packages the
    # new lockfile dropped, and the post step would save them back. Prune only
    # when that step will save: on an exact hit it saves nothing (issue #287).
    - name: Prune pnpm store
      if: inputs.install-dependencies == 'true' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune
