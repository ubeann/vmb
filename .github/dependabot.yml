version: 2
updates:
  # Actions are pinned to commit SHAs with the version in a trailing comment
  # (#489); Dependabot bumps both together. Without a bump mechanism, a new
  # action runtime only surfaces here once GitHub starts force-running the old
  # one (the Node 20 deprecation warnings, issue #33). Grouped so the whole
  # workflow surface arrives as one PR a week rather than a trickle. The
  # composite actions under .github/actions are listed too: `directory: "/"`
  # only scans .github/workflows, which once left the setup action a major
  # behind the drift workflow (#322).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # 6.4.0 is tagged on a January commit twelve commits behind 6.3.1's March
      # one and takes the action back to node20 (PR #491); a tag that moves
      # backwards is not an update. Lift this when a later tag passes 6.3.1.
      - dependency-name: neondatabase/create-branch-action
        versions: ["6.4.0"]

  # The workspace is pnpm at the repo root; Dependabot reads pnpm-lock.yaml.
  # Minor and patch bumps are grouped to keep the queue quiet — majors stay as
  # individual PRs, since those are the ones that need reading.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # pnpm refuses a release younger than a day (minimumReleaseAge,
    # ADR-0047), so a bump to one could only fail its install. Security
    # updates ignore cooldown: one for a same-day fix fails until the release
    # is a day old, or until it is added to minimumReleaseAgeExclude.
    cooldown:
      default-days: 1
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # TypeScript 7 ships no compiler API, and svelte-check and typescript-eslint
    # need one, so its bump PR can only ever be red (ADR-0044). 6.x patches
    # still arrive. Lift this when both tools support 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
