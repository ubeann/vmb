packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  "@cloudflare/workers-types": "^5.20260911.1"
  "@neondatabase/serverless": "^1.1.0"
  # Security fixes for releases a dependent pins below the patch (#326). Each
  # selector matches only the vulnerable version, so it stops applying, and can
  # be deleted, once the dependent moves on.
  # sharp: librsvg CVE-2026-96889 (GHSA-wq5f-xc86-pv6w). miniflare pins sharp
  # 0.35.4 exactly.
  "sharp@0.35.4": "0.35.5"
  # cookie: out-of-bounds name, path and domain characters (GHSA-pxg6-pf52-xh8x).
  # @sveltejs/kit 2 asks for ^0.6.0; kit 3 (#324) depends on cookie ^2.
  "cookie@<0.7.0": "^0.7.2"
# Supply chain (ADR-0047). pnpm 12 already waits a day before installing a new
# release, but falls back to it when nothing older fits; setting the value
# makes the wait strict.
minimumReleaseAge: 1440
# Fail an install when a release carries weaker provenance or trusted-publisher
# evidence than an earlier release of the same package: the sign of a
# takeover (#321). Excluded after review, both published without provenance
# by their usual maintainer once it had lapsed, and pinned by their
# dependents with no newer release in range:
#   chokidar@4.0.3      4.0.0-4.0.1 had provenance; 4.0.2-4.0.3 (Dec 2024)
#                       were published by paulmillr without it. svelte-check
#                       requires ^4.0.1.
#   undici-types@6.21.0 provenance stopped after 6.19.2; matteo.collina has
#                       published every release since. @types/node@22
#                       requires ~6.21.0.
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0
# formsnap 2.0.1 still declares sveltekit-superforms ^2.19.0 as a peer, though
# it works with 3. Delete this rule once a formsnap release includes
# svecosystem/formsnap#233, which widens the range (release tracked in #234).
peerDependencyRules:
  allowedVersions:
    "formsnap>sveltekit-superforms": "^3.0.0"
