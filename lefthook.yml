# Local git hooks: fast feedback before a push, never the gate (issue #62).
# CI is the gate (#61). Keep these fast and honest — a slow or flaky hook just
# teaches people to reach for `--no-verify`. Bypass deliberately with
# `git commit --no-verify`; the GitButler CLI has no equivalent flag.
#
# `mise install` runs `lefthook install`; run that by hand if you cloned before
# the hooks existed.
#
# Standard glob semantics: under the default `gobwas` matcher `**/` means one or
# more directories, so `scripts/**/*.sh` would miss `scripts/x.sh`. `doublestar`
# makes `**/` match zero or more, like bash.
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    # Auto-fix formatting on the staged files and re-stage the result — the one
    # thing CI cannot do for the author. `--ignore-unknown` skips file types
    # prettier has no parser for, so this runs on every staged file.
    format:
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # eslint is a per-package devDependency with a per-package flat config, so
    # there is no root binary to run it from; the script maps each staged file
    # to its package.
    eslint:
      glob: "**/*.{js,mjs,cjs,ts,tsx,svelte}"
      run: scripts/lint-staged-eslint.sh {staged_files}
    # actionlint shellchecks only the shell inside workflow `run:` blocks, so
    # the wizard scripts are checked here explicitly.
    shellcheck:
      glob: "scripts/**/*.sh"
      run: shellcheck {staged_files}
    # From a hook, `git init` follows the caller's GIT_DIR and re-initialised
    # the shared repository as bare (#422). Shellcheck cannot see that; this
    # requires the env guard above any repository-creating command.
    git-init-guard:
      glob: "scripts/**/*.sh"
      run: scripts/check-git-init-guard.sh {staged_files}
    check-git-init-guard:
      glob: "scripts/check-git-init-guard*.sh"
      run: bash scripts/check-git-init-guard.test.sh
    # The preview identifier module is shared by preview.yml and cleanup.yml, so
    # a wrong slug orphans a Pages deployment or a Neon branch rather than
    # merely looking odd; shellcheck cannot see behaviour, this can.
    preview-identifiers:
      glob: "scripts/preview-identifiers*.sh"
      run: bash scripts/preview-identifiers.test.sh
    # The commit-msg hook below is the only enforcement of the message
    # conventions, so a wrong rule there lets bad subjects through, or blocks
    # every commit.
    check-commit-msg:
      glob: "scripts/check-commit-msg*.sh"
      run: bash scripts/check-commit-msg.test.sh
    # The ticket loop's gates decide what an agent builds and merges unattended.
    ticket-lint:
      glob: "scripts/ticket-lint*.sh"
      run: bash scripts/ticket-lint.test.sh
    frontier:
      glob: "scripts/{frontier,ticket-lint}*.sh"
      run: bash scripts/frontier.test.sh
    merge-gate:
      glob: "scripts/merge-gate*.sh"
      run: bash scripts/merge-gate.test.sh
    # The one merge path: the gate, then ready and squash; the owner's call
    # recorded before any merge past a FAIL.
    merge:
      glob: "scripts/merge*.sh"
      run: bash scripts/merge.test.sh
    # The agent account's merge pace (ADR-0059); a wrong window either lets a
    # burst through or parks every PR.
    pace:
      glob: "scripts/pace*.sh"
      run: bash scripts/pace.test.sh
    # The Claude Code hook that refuses a polling wait; a wrong pattern either
    # lets the loops back or blocks ordinary work.
    check-bash-wait:
      glob: "scripts/check-bash-wait*.sh"
      run: bash scripts/check-bash-wait.test.sh
    # The reader a build uses to act on a red check; a wrong filter hides the
    # failure it was meant to show.
    ci-failed:
      glob: "scripts/ci-failed*.sh"
      run: bash scripts/ci-failed.test.sh
    # The `master` ruleset is what stops a red merge or a direct push on GitHub.
    master-ruleset:
      glob: "scripts/master-ruleset*.sh"
      run: bash scripts/master-ruleset.test.sh
    actionlint:
      # actionlint with no arguments walks .github/workflows and also checks
      # the local actions those workflows reference, so the composite action is
      # linted whenever a workflow is staged; the second glob makes it run when
      # only the action file changes.
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/action.yml"
      run: actionlint

commit-msg:
  commands:
    # The only hard enforcement of the message conventions (the repo has no
    # required status checks): Conventional Commits, and the co-author
    # trailer's shape when one is present.
    message:
      run: scripts/check-commit-msg.sh {1}
