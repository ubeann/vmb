[tools]
node = "26"
pnpm = "12"
fnox = "1.25.1"
age = "1.3.1"
# Ranged, not exact, to match the `wrangler` devDependency in apps/* (`^4.0.0`)
# — which is the wrangler that actually runs inside those packages, since pnpm
# puts their node_modules/.bin ahead of this shim. Ranging keeps the
# toolchain-drift alarm (ADR-0010) quiet for patch churn and speaking only when
# 5.x arrives, where the exact pin notified every week instead.
wrangler = "4"
# Workflow linting (actionlint) and the shellcheck it delegates `run:` blocks
# to. Pinned here like every other tool (ADR-0010) so CI and local agree.
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
_.path = ["./node_modules/.bin"]
