name = "vmb-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, WEB_URL, RESEND_API_KEY,
# and EMAIL_FROM are injected via fnox for local `wrangler dev`, and set with
# `wrangler secret put <NAME>` per environment in staging/production (see
# ARCHITECTURE.md §9). BETTER_AUTH_SECRET signs/encrypts sessions — generate
# it with `openssl rand -base64 32`. BETTER_AUTH_URL is this Worker's own
# public URL (used to build cookie/callback URLs) and WEB_URL is the deployed
# vmb-web origin (used for the auth route's CORS allowlist and Better Auth's
# trustedOrigins) — neither is secret, but they're set the same way as
# DATABASE_URL/BETTER_AUTH_SECRET so every environment (including a bare
# `wrangler deploy`) requires an explicit value instead of silently falling
# back to a wrangler.toml default meant for another environment.
#
# RESEND_API_KEY authenticates outbound verification emails via Resend
# (resend.com) — chosen over SMTP because Workers doesn't support the raw TCP
# connections a traditional SMTP client needs, and Resend's HTTP API works
# natively with fetch(). Get a key from the Resend dashboard; the local dev
# placeholder in fnox needs replacing with a real one before signup emails
# will actually send. EMAIL_FROM is the verified sender address — Resend's
# sandbox `onboarding@resend.dev` works without owning a domain for local
# dev/testing, but production needs a real domain verified in Resend.
#
# EMAIL_TRANSPORT is optional and unset everywhere except PR previews,
# whose secrets file sets it to `log` so outbound email is logged instead of
# sent via Resend (issue #121). Local `wrangler dev` and production leave it
# unset and send for real — the local `.dev.vars` needs no entry.
#
# CLIENT_IP_SECRET is optional and shared with vmb-web, which sends it with the
# browser's address on every API call. Only a request carrying the matching
# secret may name its own client IP; any other is keyed on `cf-connecting-ip`
# (#250, ADR-0042). Unset, no forwarded address is trusted. Production:
# `wrangler secret put CLIENT_IP_SECRET`, with the same value on the vmb-web
# Pages Production environment. Previews take fnox's value from the preview
# secrets file, and local `wrangler dev` from fnox via `.dev.vars`. Rotate
# both sides together.

# PR previews are Worker Previews (`wrangler preview`, ADR-0019's 2026-10-07
# amendment), and Previews take nothing from the production settings above.
# Their secrets come from preview.yml's secrets file on every run, so a
# preview's values never reach the production Worker. Logs are on so a
# preview's suppressed email, OTP codes included, can be read in the
# Preview's Observability tab. Production's observability stays as the
# dashboard sets it.
[previews.observability]
enabled = true

[previews.observability.logs]
enabled = true
invocation_logs = true
persist = true

[env.staging]
name = "vmb-api-staging"
