name = "vmb-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, and WEB_URL are injected
# via fnox for local `wrangler dev`, and set with `wrangler secret put <NAME>`
# per environment in staging/production (see ARCHITECTURE.md §9).
# BETTER_AUTH_SECRET signs/encrypts sessions — generate it with
# `openssl rand -base64 32`. BETTER_AUTH_URL is this Worker's own public URL
# (used to build cookie/callback URLs) and WEB_URL is the deployed vmb-web
# origin (used for the auth route's CORS allowlist and Better Auth's
# trustedOrigins) — neither is secret, but they're set the same way as
# DATABASE_URL/BETTER_AUTH_SECRET so every environment (including a bare
# `wrangler deploy`) requires an explicit value instead of silently falling
# back to a wrangler.toml default meant for another environment.

[env.staging]
name = "vmb-api-staging"
